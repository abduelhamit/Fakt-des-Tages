name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages; `pages: write` also lets configure-pages
# turn Pages on for the repo the first time this runs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `lfs: true` is load-bearing: the fact images are in Git LFS, and the default
      # checkout would hand the build 130-byte pointer files to copy into build/fakten/,
      # deploying every image on the site broken, with everything green.
      - uses: actions/checkout@v7
        with:
          lfs: true

      # Fail fast if Pages cannot be enabled, before spending time on a build.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      # Reads the pnpm version from package.json "packageManager". Pinned to the full
      # version: pnpm 12 needs v6.1.0, and the floating v6 tag still predates it.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      # The e2e layer is deliberately not in the gate: it needs a chromium download.
      - run: pnpm vitest run
      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
