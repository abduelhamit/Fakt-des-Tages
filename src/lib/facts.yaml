  Heute vor 180 Jahren wurde in Hoboken, New Jersey das erste auf den Regeln von Alexander Cartwright basierende Baseballspiel ausgetragen. Den Begriff "base ball" gab's zu jenem Zeitpunkt schon mindestens 100 Jahre, aber ohne formelle Regeln wie heute. Seine Regeln sind noch bis heute gültig, umfassten anfangs aber noch nicht sämtliche Spielregeln, nach denen gespielt wurde, sondern gaben nur verbindliche Entscheidungen für eine Reihe häufiger Zweifelsfälle an. Die New York Nine siegten gegen die New York Knickerbockers 23–1.

