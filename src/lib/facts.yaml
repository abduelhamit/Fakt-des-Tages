  Heute vor 76 Jahren gewann im De-facto-Endspiel der 4. FIFA-Fußball-Weltmeisterschaft Uruguay gegen den Gastgeber Brasilien 2–1. Vor 200.000 Cariocas im Maracanã-Stadion in Rio de Janeiro ging das Spiel unter dem Namen Maracanaço (Schock von Maracanã) in die Geschichte ein. Brasilien ging zunächst, kurz nach der Halbzeitpause, mit 1:0 in Führung. Mitte der zweiten Hälfte glich Uruguay aus. Zehn Minuten vor Schluss gelang Uruguay der entscheidende Treffer zum Sieg und zur Weltmeisterschaft. Das Spiel galt als Tiefpunkt des brasilianischen Fußballs… bis zur 1:7-Niederlage gegen Deutschland 2014.

