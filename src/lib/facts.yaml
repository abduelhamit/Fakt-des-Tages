  Heute vor 18 Jahren ging am Europäischen Kernforschungszentrum CERN bei Genf der Large Hadron Collider (LHC), der aktuell größte Teilchenbeschleuniger der Welt, offiziell in Betrieb. Um 10:28 Uhr wurde dabei der erste Protonenstrahl erfolgreich durch den 27 km langen Ring geleitet. Die bisher größte Errungenschaft des LHCs war die Bestätigung des Higgs-Bosons, des damals letzten noch nicht endgültig nachgewiesenen Teilchens des Standardmodells der Teilchenphysik.

