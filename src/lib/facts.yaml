  Heute vor 40 Jahren veröffentlichte Metallica ihr drittes Album, [Master of Puppets](https://music.youtube.com/playlist?list=OLAK5uy_lSza7aA85vMKSEiQ0wDr1nkAXpwO80x9Q "https://music.youtube.com/playlist?list=olak5uy_lsza7aa85vmkseiq0wdr1nkaxpwo80x9q"), welches als Meilenstein des Thrash Metals gilt. Es war auch das letzte Album, das Metallica mit Cliff Burton am Bass aufnahm, da er noch im selben Jahr bei einem Busunfall in Schweden während einer Tournee starb.

  ![Das Albumcover von „Master of Puppets“: Reihen weißer Grabkreuze auf einem Feld unter rotem Himmel, von oben greifen Hände mit Marionettenfäden hinein, darüber das Metallica-Logo, unten „MASTER OF PUPPETS“.](fakten/2026-03-03-1.avif)
