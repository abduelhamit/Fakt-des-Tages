  Heute vor 250 Jahren erschien „Der Wohlstand der Nationen“, das Hauptwerk des schottischen Ökonomen Adam Smith. Das Buch gilt als das grundlegende Werk der Wirtschaftswissenschaft, die sich erst in der Folgezeit als eigenständige Wissenschaftsdisziplin etablierte und ist der Ursprung der berühmten Metapher der „unsichtbaren Hand“, die den Markt durch individuelles Eigeninteresse reguliert.

  ![Ein aufgeschlagener Band von 1776 mit dem Titelblatt in Fraktur: „Untersuchung der Natur und Ursachen von Nationalreichthümern von Adam Smith“, „Erster Band“, „Leipzig, bey Weidmanns Erben und Reich. 1776.“, gegenüber eine leere Seite mit einer handschriftlichen Notiz.](fakten/2026-03-09-1.avif)
