  Heute vor 1.210 Jahren schlug ein Meteorit auf einem Tempelgelände in Nōgata auf der japanischen Insel Kyūshū ein. Es ist der weltweit früheste beobachtete Meteoritenfall, von dem heute noch Material vorhanden ist. Der Meteorit soll die Nacht zum Tage gemacht und nach einer Explosion durch das Dach des Shintō-Tempels Suga-Jinja gefallen sein. Als heiliger Gegenstand wurde er schließlich von dem zuständigen Priester in einer Holzschatulle aufbewahrt und wird heute in jenem Tempel ausgestellt.

