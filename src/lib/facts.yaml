  Heute vor 113 Jahren wurde das Shubert Theatre in Manhattan, New York City, eröffnet. Benannt nach Sam S. Shubert, dem verstorbenen Bruder der Eigentümer Lee und J. J. Shubert, und vom Architekten Henry Beaumont Herts errichtet, eröffnete das Theater mit Hamlet. Im Laufe seiner Geschichte war es Spielort zahlreicher langlebiger Musicals, wie etwa Bells Are Ringing und Promises, Promises. Die am längsten laufende Produktion war das Musical A Chorus Line, das von 1975 bis 1990 lief.

  ![Das Shubert Theatre an einem sonnigen Tag, von der Straßenecke aus gesehen: ein cremefarbener, mehrstöckiger Bau mit abgerundeter Ecke, blaugrauen Ornamentfeldern in der Fassade und einem grünen Kupferdach mit Gauben. An der Ecke hängt eine senkrechte Leuchttafel mit gelben Glühbuchstaben: „SHUBERT THEATRE“, „CELEBRITY AUTOBIOGRAPHY“ und „NYT CRITIC’S PICK“. Darunter führt ein dunkelblaues Vordach mit der Aufschrift „225 Shubert Theatre“ in gebrochener Schrift zum Eingang, davor drängen sich Passanten auf dem Gehweg. Links zeigt ein Werbebildschirm das Porträt eines Mannes mit dem Namen „Danny Burstein“, rechts zieht sich ein gelb leuchtendes Vordach an der Seitenfassade entlang; im Hintergrund ragen Hochhäuser und ein eingerüsteter Neubau in den blauen Himmel.](fakten/2026-10-02-1.avif)
  _Foto: [Casey „Poppins“ Nedelka](https://commons.wikimedia.org/wiki/File:Shubert_Theatre_June_2026_4.jpg), [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)_
2026-10-05: |-
  Heute vor 64 Jahren wurde der britische Actionfilm James Bond – 007 jagt Dr. No in London uraufgeführt. Ein paar Monate später startete er in den bundesdeutschen Kinos. Er ist der erste Film nach Ian Flemings James-Bond-Agentenromanen.

  Im Film wird James Bond nach Jamaika entsandt, um das Verschwinden eines britischen Agentenkollegen zu untersuchen. Die Spur führt ihn zur Untergrundbasis von Dr. No, der plant, einen frühen amerikanischen Raketenstart von Cape Canaveral aus mit einer Funkstrahlenwaffe zu stören. Obwohl Dr. No der erste der Bond-Romane war, der verfilmt wurde, handelte es sich dabei um den sechsten Teil von Flemings Reihe, die mit Casino Royale begonnen hatte. Während der Film bei seiner Veröffentlichung von der Kritik gemischt aufgenommen wurde, gilt er heute als einer der besten Teile der Reihe. Die beiden Hauptdarsteller Sean Connery und Ursula Andress schafften damit jeweils ihren internationalen Durchbruch.

  Viele Aspekte eines typischen James-Bond-Films wurden bereits in diesem Film etabliert. Dazu zählen John Barrys Arrangement des James Bond Theme, der Blick durch einen Pistolenlauf zu Filmbeginn, eine starke und erotische Frauenrolle, exotische Handlungsorte, die Verwendung von Gadgets sowie besonderen Fahrzeugen und ein größenwahnsinniger, versehrter Gegenspieler mit seinen Handlangern. Im Vergleich zu den folgenden Bond-Filmen beginnt Dr. No noch direkt mit dem Vorspann; erst ab Liebesgrüße aus Moskau unterteilt dieser die Handlung. Obwohl sich der Vorspann noch stilistisch von seinen Nachfolgern unterscheidet, wurde er bereits hier von Maurice Binder entworfen. Er erstellte auch alle weiteren von Feuerball bis Lizenz zum Töten.

  ![Der deutsche Titelschriftzug des Films in kräftigen roten, schmal laufenden Großbuchstaben, auf zwei Zeilen: oben „JAMES BOND-“, darunter „007 JAGT DR. NO“. Zwischen „007“ und „JAGT“ steht die blassrosa Silhouette einer Pistole, deren Lauf nach rechts zeigt.](fakten/2026-10-05-1.avif)
  _Logo: Atelier Degen, 1962_
