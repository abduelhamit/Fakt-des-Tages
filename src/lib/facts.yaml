  Heute vor 140 Jahren schaltete der US-amerikanische Apotheker John Pemberton in Atlanta erstmals eine Werbeanzeige für sein neuestes Medikament: Coca-Cola. Es richtete sich vor allem an städtische Kopfarbeiter, die unter Müdigkeit, Kopfschmerzen, Depressionen, Impotenz oder der Modekrankheit Neurasthenie litten. Gemixt mit Sodawasser ergab dieser Sirup ein Erfrischungsgetränk, welches dank der namensgebenden Kokablättern und Kolanüssen damals garantiert besser ballerte als heute. Dafür macht heute The Coca-Cola Company einen Jahresumsatz von ca. 48 Mrd. US-Dollar.

