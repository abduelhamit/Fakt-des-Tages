  Heute vor 115 Jahren entdeckte eine Expedition unter Leitung von Hiram Bingham in den peruanischen Anden die Ruinen der von den Inka im 15. Jahrhundert erbauten Stadt Machu Picchu. Die Inka erbauten die Stadt in 2430 Metern Höhe auf einem Bergrücken zwischen zwei Gipfeln. Die UNESCO nahm Machu Picchu 1983 in die Liste des Weltkulturerbes auf und ist eine der größten Touristenattraktionen in Südamerika. 2017 besuchten über 1,4 Mio. Personen die Sehenswürdigkeit; dies entspricht einem täglichen Durchschnitt von knapp 3.900 Personen. Die UNESCO fordert jedoch eine Reduktion auf höchstens 800 Besucher täglich, um das Kulturerbe nicht zu gefährden.

