  Heute vor 70 Jahren wurde in der Bundesrepublik Deutschland und West-Berlin ein neues System der deutschen Kfz-Kennzeichen eingeführt, das bis heute gültig ist. Bis dahin hatten Kennzeichen weniger Zeichen, die fast alle Ziffern waren. Jedoch war schon einige Jahre zuvor klar, dass das alte System nicht der zunehmenden Motorisierung gewachsen sei, da die vier Ziffern der Nummerierung nicht mehr für alle Kfz eines Verwaltungsbezirks ausreichten. Diese sogenannten DIN-Kennzeichen, benannt nach ihrer Schriftart, die nach DIN 1451 (Mittelschrift) festgelegt ist, unterscheiden sich nur wenig von den heutigen Kennzeichen. Die größten Unterschiede sind der Euro-Teil auf der linken Seite, die neue Schrift namens FE-Schrift (FE steht für fälschungserschwerend) und ein paar Änderungen bei den zulässigen. Buchstaben. Sonst sind sie praktisch gleich geblieben.

  ![Ein altes weißes Kennzeichen „LI-CK 70“ in schmaler schwarzer Schrift, zwischen den Buchstaben eine blaue Prüfplakette und das bayerische Zulassungssiegel.](fakten/2026-07-01-1.avif)
  _Foto: [Walser123](https://commons.wikimedia.org/wiki/File:Altes_DIN-Kennzeichen_Lindau_am_Bodensee.jpg), [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)_
