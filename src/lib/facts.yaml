  Heute vor 150 Jahren führte Alexander Graham Bell mit seinen Geräten ein erstes erfolgreiches Telefongespräch. Bell sagte zu seinem Assistenten: „Mr. Watson, come here. I want to see you.“ Auch wenn Bell nicht das erste Telefon erfunden hatte (Der deutsche Lehrer und Erfinder Philipp Reis führte seinen Apparat, den „Telephon“, schon vor 15 Jahren vor.), war er derjenige, der das massentauglich machte. Ein Jahr nach dem Gespräch gründete Bell die Bell Telephone Company, den Vorgänger von AT&T.

  ![Eine handschriftliche Doppelseite aus Bells Laborbuch, datiert „March 10th 1876“: links eine Skizze des Senders mit Mundstück und Draht zum Empfänger, darunter und rechts eng beschriebene Zeilen mit „Mr. Watson – Come here – I want to see you“.](fakten/2026-03-10-1.avif)
