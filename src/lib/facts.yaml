  Heute vor 30 Jahren gewann im Finale der UEFA-Fußball-Europameisterschaft in England Deutschland gegen Tschechien durch ein Golden Goal von Oliver Bierhoff. Die Meisterschaft fing schon gut an mit Deutschland auf Platz 1 in der Gruppe C gegen Tschechien, Italien und Russland in der Reihenfolge. Danach die Finalen waren Deutschland – Kroatien 2:1 (1:0), England – Deutschland 1:1 n. V. (1:1, 1:1), 5:6 i. E. (da hatte Deutschland mehr Glück gehabt als gestern) und Tschechien – Deutschland 1:2 n. GG (1:1, 0:0). Beide Tore kamen von Oliver Bierhoff in der 73. und 95.; das gegnerische Tor schoss Patrik Berger in der  59. bei einem Foulelfmeter.

