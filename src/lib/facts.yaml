  Heute vor 10 Jahren veröffentlichte Nintendo das Partyspiel Mario Party: Star Rush für die Nintendo 3DS.

  Das Spiel bricht mit dem traditionellen rundenbasierten Spielprinzip der Mario-Party-Reihe: Man würfelt und bewegt sich nun gleichzeitig auf nicht linearen, rasterartigen Spielfeldern. Trotzdem konzentriert sich der Hauptmodus, in dem die Figuren auf einem Spielbrett mit diversen Minispielen gegeneinander antreten, auf das Ziel, die meisten Sterne zu sammeln.

  Das Spiel verkaufte sich in Japan innerhalb von zwei Monaten mehr als 88.000 Mal und erhielt gemischte Reaktionen; einige lobten die neue Ausrichtung der Reihe sowie den Verzicht auf das umstrittene, auf Fahrzeugen basierende Spielprinzip von Mario Party 9 und Mario Party 10. Kritik gab es hingegen vor allem an den repetitiven Spielmodi sowie an der geringen Anzahl an Spielfeldern und Minispielen.

  ![Das quadratische Titelbild von Mario Party: Star Rush: In der Mitte steht der Schriftzug „MARIO PARTY“ in bunten Blockbuchstaben, jeder in einer anderen Regenbogenfarbe, darunter „STAR RUSH“ in Gelb mit blauem Rand. Davor springt Mario mit erhobener Faust nach vorn, umringt von einem grünen Toad mit einem großen Würfel, Toadette mit einer Eichel, Peach mit einem Korb voller Äpfel auf dem Rücken, Luigi mit einem grünen Panzer, Yoshi, Wario und einem blauen Toad. Dahinter tummeln sich auf einer Wiese mit Steinplatten, Fragezeichenblöcken und Blumen König Bob-omb, Waluigi, Diddy Kong, ein gelber Toad auf einem Wiggler, eine Piranha-Pflanze, Rosalina, Daisy, ein großer Gumba, der mit offenem Mund und einer Blase an der Nase schläft, und mehrere kleine Gumbas; am hellblauen Himmel stehen Regenbögen und Sterne.](fakten/2026-10-07-1.avif)
  _Artwork: Nintendo, 2016_
