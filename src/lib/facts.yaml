  Heute vor 167 Jahren war Edwin Drake die erste Person, die erfolgreich nach Öl in den USA gebohrt hatte. Das war in Titusville, Pennsylvania, womit er auch den ersten Ölrausch der Vereinigten Staaten ausgelöst hatte. Titusville und andere Orte am Ufer des Oil Creek wuchsen rasch, während in der gesamten Region Ölquellen und Raffinerien aus dem Boden schossen. Erdöl entwickelte sich schnell zu einem der wertvollsten Rohstoffe und das Eisenbahnnetz wurde bis nach West-Pennsylvania ausgebaut, um das Erdöl in den Rest des Landes zu transportieren. Die Ölförderung in Pennsylvania erreichte 32 Jahre später ihren Höhepunkt, wurde aber nachher von westlichen Bundesstaaten wie Texas und Kalifornien übertroffen; dennoch ist die Ölindustrie in Pennsylvania auch heute noch vertreten.

  ![Schwarz-Weiß-Bild des Drake-Bohrturms: ein hoher hölzerner Turm neben einem Bretterschuppen auf einer Lichtung, davor zwei Männer im Gespräch, rechts mit Zylinder Edwin Drake, hinten drei Arbeiter an einem Zaun.](fakten/2026-08-27-1.avif)
