  Heute vor 35 Jahren erschien in den USA Nevermind, das zweite Studioalbum der Grunge-Band Nirvana. Es wurde weltweit rund 30 Millionen Mal verkauft und gehört damit zu den meistverkauften Musikalben aller Zeiten.

  Die bekannteste Single des Albums ist Smells Like Teen Spirit. Sie gilt als der Titel, der Grunge im Allgemeinen und Nirvana im Speziellen zum Durchbruch verhalf. Der Videoclip zum Song ist das meistgespielte Video auf dem Musikkanal MTV. Die Namensgebung des Liedes ist auf ein Deodorant namens Teen Spirit zurückzuführen. Kurt Cobains Freundin benutzte dieses Deodorant und so roch Cobain selbst danach. Eine Bekannte sprühte darum „Kurt smells like Teen Spirit“ an Cobains Wand. Die Verkaufszahlen des Deodorants schossen mit zunehmendem Erfolg der Single in die Höhe.

  ![Das Cover des Albums Nevermind: In blauem Poolwasser schwimmt ein nackter Säugling mit ausgebreiteten Armen auf die Kamera zu und blickt dabei auf einen Ein-Dollar-Schein, der rechts von ihm an einem Angelhaken hängt. Über ihm kräuselt sich die von Licht durchflutete Wasseroberfläche; unten links steht in großen schwarzen Lettern NIRVANA und darunter der verzerrte Schriftzug NEVERMIND.](fakten/2026-09-24-1.avif)
  _Cover: Kirk Weddle (Foto), Robert Fisher (Gestaltung), DGC Records 1991_
