  Heute vor 16 Jahren wurde die britische Boyband One Direction gegründet. Die fünf Mitglieder meldeten sich bei der Castingshow The X Factor an (nicht zu verwechseln mit X-Factor: Das Unfassbare, präsentiert von Jonathan Frakes), konnten sich solo im Bootcamp nicht durchsetzen, wurden aber von der Jury zu einer Band geformt, die zwar die Show nicht gewann, aber dennoch erfolgreich genug für einen Plattenvertrag war. Ein Jahr später veröffentliche sie die Single „What Makes You Beautiful“, welche ein internationaler Hit wurde und die Bandmitglieder zu Stars machte. Bei der Schlussfeier der Olympischen Sommerspiele 2012 in London durften sie mit dem Song neben anderen Acts auftreten. Nach insgesamt sechs Jahren und fünf allesamt erfolgreichen Alben hat die Band bis auf Weiteres eine Pause eingelegt.

