  Heute vor 150 Jahren wurde in Bremerhaven der Zeitball nördlich der Einfahrt zur Schleuse des Neuen Hafens in Betrieb genommen.

  Ein Zeitball war ein an erhöhter Stelle angebrachter und weithin sichtbarer Signalball, der zu einem festgelegten Zeitpunkt fallen gelassen wurde und es den Seeleuten erlaubte, ihre Schiffschronometer zu überprüfen. Die genaue Kenntnis der Uhrzeit war im 19. Jahrhundert unabdingbar, um den Längengrad der Position eines Schiffes auf See exakt zu bestimmen. Es war deshalb wichtig, das Chronometer im Hafen auf die Sekunde genau stellen zu können. Dazu war ein optisches Signal aufgrund der kürzeren Laufzeit besser geeignet als ein akustisches, wie z. B. ein Warnton.

  Mit dem Aufkommen und der Verbreitung funktelegrafischer Zeitzeichen ab 1907 verloren Zeitbälle allmählich ihre Bedeutung. In Bremerhaven wurden mit dem Zeitball ab dem 1. Januar 1929 keine Zeitsignale mehr abgegeben, nachdem der Turm auf Lichtzeitsignale umgestellt worden war. Vermutlich 1947 wurde der Zeitballturm verschrottet.

  ![Ein kolorierter Holzstich von 1876: Am sandigen Hafenufer steht ein schlanker, sich nach oben verjüngender Turm aus Blech, oben eine Plattform mit einem Mast, an dem der dunkle Zeitball hängt; daneben ein kleines achteckiges Wärterhäuschen. Links liegen Großsegler mit kahlen Rahen am Kai, rechts öffnet sich das Wasser mit weiteren Segelschiffen. Auf dem Vorplatz stehen Fässer, Kisten und einige Menschen in Kleidung des 19. Jahrhunderts.](fakten/2026-10-01-1.avif)
