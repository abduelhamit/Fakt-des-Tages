  Heute vor 75 Jahren waren die russischen Hündinnen Desik (Дезик) und Zygan (Цыган) die ersten Wirbeltiere, die einen Raumflug überlebten. Vier Jahre zuvor brachten die Vereinigten Staaten mit einigen Fruchtfliegen erstmals Tiere ins Weltall, die den Flug auch überlebten. Danach begannen die USA, mit Rhesusaffen und Mäusen erstmals Wirbeltiere ins Weltall zu schicken, die jedoch ihre Flüge allesamt nicht überlebten. Russland entschied sich für Hunde, da Sergei Koroljow, der damals führende sowjetische Raketeningenieur glaubte, dass die emotionale Bindung der Wissenschaftler zu den Hunden deren Gehorsam gewährleisten würde. Außerdem waren sie Straßenhunde aus Moskau, die bereits an das Überleben unter schwierigen Bedingungen kannten, mussten weiblich sein, damit sie in ihren Raumanzügen problemlos urinieren konnten und helles Fell haben, um sie auf den Aufnahmen der Bordkamera gut zu erkennen.

