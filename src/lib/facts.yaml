  Heute vor 60 Jahren begann der US-Fernsehsender NBC mit der Ausstrahlung der Science-Fiction-Fernsehserie Star Trek (im deutschen Fernsehen Raumschiff Enterprise). Unter dem Kommando von Captain James T. Kirk (gespielt von William Shatner) erkundet das Raumschiff Enterprise unbekannte Bereiche des Universums. Dabei wird seine internationale Besatzung mit unbekannten Phänomenen, Lebensformen und Feinden konfrontiert. Wegen schwacher Einschaltquoten stellte NBC die Serie 1969 nach drei Staffeln mit insgesamt 79 Folgen ein. Erst in den folgenden Jahren entwickelte sie sich aufgrund zahlreicher Wiederholungen zu einem popkulturellen Phänomen.

