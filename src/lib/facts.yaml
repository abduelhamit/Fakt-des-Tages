  Heute vor 25 Jahren trat das Schengener Abkommen für Dänemark, Finnland und Schweden sowie die Nicht-EU-Staaten Island und Norwegen in Kraft. Damit wurde ein weiterer wichtiger Schritt im freien Waren- und Personenverkehr und dadurch in der Stärkung Europas gegangen.

  ![Europakarte des Schengen-Raums: die Mitgliedstaaten von Portugal bis Finnland, dazu Island, in Dunkelblau, die übrigen Länder in Grau und Zypern in Gelb.](fakten/2026-03-25-1.avif)
