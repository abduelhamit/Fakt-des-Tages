  Heute ist [Safer Internet Day](https://www.klicksafe.de/sid "https://www.klicksafe.de/sid"), ein Aktionstag, den 2008 die EU-Kommission ins Leben gerufen hat, um Aufmerksamkeit auf das Thema "Sicheres Internet" und digitale Medienkompetenz zu lenken, mit besonderem Fokus auf Kinder und Jugendliche. Bei den ganzen KI-Chatbots und generierten Bildern und Videos eine durchaus wichtige Sache.

  ![Das Maskottchen des Safer Internet Day: eine lila Comicfigur mit Antenne und blauen Flossenohren, die entschlossen dreinblickt, den Daumen hochreckt und einen hellblauen Schild mit Europasternen und einer Weltkugel vor sich hält.](fakten/2026-02-10-1.avif)
  _Grafik: [Europäische Union / Better Internet for Kids](https://better-internet-for-kids.europa.eu/en/saferinternetday), [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)_
