  Heute vor 13 Jahren hat die CIA öffentlich die Existenz von Area 51 anerkannt. Das passierte nach einer Anfrage 8 Jahre zuvor im Rahmen des Freedom of Information Acts. Von den bisher veröffentlichten Dokumenten weiß man, dass dort viele experimentelle Luftfahrzeuge getestet werden; in GTA: San Andreas konnte man dort sich einen Jetpack schnappen. Am bekanntesten ist wohl aber die Verschwörungstheorie, dass da Aliens festgehalten werden. 2019 wurde im Internet die "Stürmung" des Geländes zum 20. September mit einem Augenzwinkern organisiert. Tausende Menschen kamen zu zwei Musikfestivals in der Nähe, die extra dafür da waren; über 150 Leute sind tatsächlich friedlich bis zu den Eingangstoren von Area 51 gewandert, wo die Kontrolleure natürlich von der Aktion Bescheid wussten und es mit Humor nahmen. Nur 7 Personen wurden verhaftet.

