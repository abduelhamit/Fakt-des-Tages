  Heute vor 40 Jahren kam die japanische Videospielkonsole Nintendo Entertainment System, kurz NES, erstmals auf den europäischen Markt, nachdem sie über drei Jahre lang im japanischen und knapp ein Jahr im nordamerikanischen Markt verfügbar war. Das NES war mit über 60 Millionen verkauften Einheiten lange Zeit die meistverkaufte Heimkonsole, bevor die erste PlayStation sie einholte. Der Controller führte das Steuerkreuz (kurz: D-Pad für Direction-Pad) ein und definierte die grundsätzliche Tastenanordnung der Gamepads. Bekannte Spieleserien wie Super Mario Bros., The Legend of Zelda, Metroid oder Castlevania gaben auf dem NES ihr Debüt.

