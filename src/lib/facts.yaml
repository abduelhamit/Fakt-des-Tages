  Heute vor 50 Jahren gründeten Steve Jobs, Steve Wozniak und Ron Wayne, Mitglieder des Homebrew Computer Clubs, das Unternehmen Apple und stellen ihren ersten Computer vor, den Apple I. Sie verkauften circa 200 Apple I zu einem Einzelpreis von 666,66 US-Dollar; ca. ein Jahr später wurde der Apple I durch den Apple II abgelöst, der zum Welterfolg wurde. Und der Rest ist History.

  ![Der Apple I in einem selbstgebauten Holzgehäuse mit beiger Tastatur, darüber ein Holzbrett mit dem ausgesägten Schriftzug „APPLE“ und dem eingeschnitzten „COMPUTER“.](fakten/2026-04-01-1.avif)
