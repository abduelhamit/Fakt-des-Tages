  Heute oder gestern vor 243 Jahren hob die erste Montgolfière ab, heutzutage als Heißluftballons bekannt. Die Erfinder, die Brüder Montgolfier, demonstrieren sie noch unbemannt in ihrer Heimatstadt Annonay. Der kugelähnliche Sack aus Leinen von 12 m Durchmesser stieg bis auf fast 2000 m Höhe und schwebte etwa 2 km weit, bevor er nach insgesamt 10 Minuten zu Boden sank. Damals dachte man noch, dass der Rauch den Ballon schweben lasse.

