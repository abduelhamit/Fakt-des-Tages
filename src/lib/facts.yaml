  Heute vor 99 Jahren übertrug Philo Farnsworths Bildzerlegerkamera ihr erstes Bild, eine einfache gerade Linie, an einen Empfänger in einem anderen Raum seines Labors in der Green Street 202 in San Francisco. Aufgrund der geringen Lichtempfindlichkeit des Systems war eine extrem helle Lichtquelle erforderlich. Seine Geldgeber wollten wissen, wann sie mit der Erfindung Geld verdienen würden; daher war das erste gezeigte Bild passenderweise ein Dollarzeichen. Bis zum nächsten Jahr hatte Farnsworth das System so weit entwickelt, dass er es der Presse vorführen konnte. Philo Farnsworth war ein amerikanischer Erfinder, dem die US-Regierung das erste Patent für das Fernsehen erteilte und neben dem Bildzerleger außerdem eine Videokameraröhre erfand.

  ![Schwarz-Weiß-Aufnahme: Philo Farnsworth im Anzug steht im Profil an seiner Fernsehanlage und dreht an einem Knopf des großen Holzschranks. Darauf steht ein Holzkasten mit ovalem Bildschirm und einem runden Lautsprecher am Schwanenhals; die Frontplatte des Schranks trägt ein Messinstrument und mehrere Reihen von Drehreglern.](fakten/2026-09-07-1.avif)
