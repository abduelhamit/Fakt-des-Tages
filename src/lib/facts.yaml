  Heute vor 6 Jahren veröffentlichte das chinesische Entwicklerstudio miHoYo das Action-Rollenspiel Genshin Impact für PC, Konsolen und Mobilgeräte; „Genshin“ steht dabei für Ur-Gott. Das Spiel bietet eine Open-World-Umgebung im Anime-Stil, ein actionorientiertes Kampfsystem mit Elementarmagie und charakterindividuellen Fähigkeiten sowie eine mythische Hauptgeschichte. Genshin Impact ist ein Free-to-Play-Titel (sprich, man *muss* nix zahlen, ums zu spielen), der über Gacha-Mechaniken monetarisiert wird (Gacha heißt, dass man beim Geldausgeben Glück haben muss, um die richtige Figur freizuschalten). Die Entwicklungskosten für die Markteinführung betrugen ca. 100 Mio. $; bis heute belaufen sich die Kosten auf insgesamt 1,1–1,3 Mrd. $. Der Gesamtumsatz liegt inzwischen bei über 10 Mrd. $.

  ![Ein Screenshot aus Genshin Impact: Die blonde Spielfigur steht, von hinten gesehen, in hohem grünen Gras auf einer Anhöhe und blickt über ein weites Tal — Wiesen, einzelne Bäume, helle Felsplateaus und dahinter eine Bergkette unter blauem Himmel mit lockeren Wolken. Die Grafik ist im Anime-Stil gehalten, mit kräftigen Farben und weichem Licht.](fakten/2026-09-28-1.avif)
