  Heute vor 151 Jahren wurde in der norwegischen Hauptstadt Oslo (damals noch Christiania genannt) die erste Pferdestraßenbahn in Betrieb genommen. Sie bestand praktisch aus Pferdekutschen auf Schienen. Im Verlauf der folgenden Jahre wurden vier Strecken gebaut, die alle bei Stortorvet (Marktplatz) starteten. Die Endstationen waren Homansbyen (im Nordwesten), Munkedamsveien, Oslo (heute heißt diese Gegend Gamlebyen) sowie das Arbeiterviertel Grünerløkka. Nach 25 Jahren wurde die Pferdebahn elektrifiziert. Ob aus den ausgemusterten Pferden Lasagne wurde, ist nicht bekannt.

  ![Ein Schwarz-Weiß-Foto einer gepflasterten Straße in Kristiania: Ein geschlossener Pferdestraßenbahnwagen, schräg von hinten gesehen, mit Lamellenfenstern an der Seite und einer offenen hinteren Plattform; oben auf dem geschwungenen Dach ein Schild „HOMANSBY“. Rechts ziehen zwei Pferde den Wagen, dahinter ein zweiter Wagen mit demselben Schild. Im Hintergrund ein Haus mit der Aufschrift „CAFÉ“, davor Passanten, und ein mehrstöckiges helles Eckgebäude; in der Mitte ein hoher Mast. Rechts im Vordergrund geht eine Frau in langem dunklem Kleid mit heller Schürze und großem Hut vorbei, einen großen Henkelkorb vor sich.](fakten/2026-10-06-1.avif)
  _Foto: [Urheber unbekannt, Oslo byarkiv](https://commons.wikimedia.org/wiki/File:KSS_horsecar_1880.jpg), [CC BY-SA 3.0 NO](https://creativecommons.org/licenses/by-sa/3.0/no/)_
