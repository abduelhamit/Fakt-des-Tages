  Heute vor 140 Jahren schaffte Charles Martin Hall nach einigen Jahren intensiver Arbeit zum ersten Mal, mit einem neuen Verfahren, das viel günstiger war als alle davor, aus Tonerde Aluminium zu gewinnen. 136 Tage danach reichte er das später benannte Hall-Héroult-Prozess beim Patentamt ein, was mit einigen Verbesserungen noch heute industriell angewandt wird und mir gerade ermöglicht, auf dieser Aluminiumkiste von Apple zu tippen.

  ![Eine reich verzierte Metallschatulle mit dunkelviolettem Samtfutter in einer Museumsvitrine, im warmen Licht golden schimmernd, darin kleine Aluminiumkügelchen und eine größere flache Scheibe; dahinter eine gelochte Metallwand.](fakten/2026-02-23-1.avif)
