  Heute vor 5 Jahren blieb die Ever Given, ein Containerschiff der Evergreen-Klasse, im Suezkanal stecken und blockierte sechs Tage lang die Durchfahrt für andere Schiffe. Die Blockade führte Schätzungen zufolge zu einem täglichen Ausfall im Wert von über 9 Mrd. $. Kurz zuvor malte der Kapitän mithilfe der Route des Schiffs 1 Pimmel ins Wasser, was der ganzen Situation noch das Sahnehäubchen aufsetzte. Die Memes dazu gefallen mir immer noch:

  ![Meme-Video: Die Szene aus Austin Powers, in der Austin mit einem Fahrzeug in einem engen Gang wenden will und darin stecken bleibt — nur ist das Fahrzeug hier durch die Ever Given ersetzt.](fakten/2026-03-23-1.avif)
