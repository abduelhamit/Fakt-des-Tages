  Heute vor 216 Jahren komponierte Ludwig van Beethoven das Klavierstück [„Für Elise“](https://commons.wikimedia.org/wiki/File:FurElise.ogg "https://commons.wikimedia.org/wiki/File:FurElise.ogg"). Heute kaum von Klavierübungen wegzudenken, wurden die Notenblätter erst 40 Jahre nach seinem Tod von Ludwig Nohl veröffentlicht. Man konnte nicht eindeutig ermitteln, wer „Elise“ ist; dazu gibt's verschiedene Thesen. Klar ist, dass sie eine enge Freundin Beethovens und wahrscheinlich eine wichtige Person in seinem Leben war.

  ![Eine gedruckte Notenseite mit den ersten Takten von „Für Elise“ im 3/8-Takt, darunter eine Fußnote in Fraktur, die die Aufschrift „Für Elise am 27 April zur Erinnerung von L. v. Bthvn“ zitiert.](fakten/2026-04-27-1.avif)
