  Heute vor 190 Jahren beobachtete der britische Astronom Francis Baily ein optisches Phänomen, was später nach ihm benannt wurde, die Bailyschen Perlen. Diese Lichter kann man nur bei einer totalen Sonnenfinsternis beobachten: Durch die Unebenheit der Mondoberfläche leuchtet die Sonne kurz vor und nach der Totalität durch die Täler zwischen den Mondbergen hindurch. Diese Lichtpunkte sehen dann wie Perlen an einer Schnur aus.

  ![Eine totale Sonnenfinsternis: die schwarze Mondscheibe, an deren oberem Rand zwei helle Lichtpunkte hervorblitzen.](fakten/2026-05-15-1.avif)
