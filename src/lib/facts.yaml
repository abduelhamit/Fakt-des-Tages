  Heute vor 551 Jahren kam Michelangelo in Florenz auf die Welt. Als einer der bedeutendsten Künstler der italienischen Renaissance, der als einer der ganz wenigen Zeitgenossen Leonardo da Vinci das Wasser reichen konnte, brauche ich wahrscheinlich nicht viel zu sagen; jeder wird „Die Erschaffung Adams“ wiedererkennen.

  ![Michelangelos Fresko „Die Erschaffung Adams“: Gott streckt aus einer Schar von Engeln heraus den Finger nach dem liegenden Adam aus, die Fingerspitzen berühren sich fast.](fakten/2026-03-06-1.avif)
