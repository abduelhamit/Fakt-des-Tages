  Heute vor 75 Jahren stellte Erik Wallenberg seine neueste Entwicklung der Öffentlichkeit vor: eine neuartige tetraederförmige Kartonverpackung für Flüssigkeiten, genannt Tetra Pak. Die Tetraeder-Form war damals herstellungsbedingt, da ein bereits befüllter Kartonschlauch jeweils um 90 Grad verdreht abgeklemmt, verschweißt und abgeschnitten wurde. Damals noch für Milch entwickelt, wird die Verpackung für alle möglichen Inhalte in Form eines kompakten Quaders angeboten.

