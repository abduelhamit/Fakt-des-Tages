  Heute vor 49 Jahren war der Verkaufsstart des Apple II. Damals zelteten die Leute zwar nicht vor Apple-Stores in einer Schlange, einmal weil es noch keine Apple-Stores gab und weil es 1.298 US$ (knapp 7.000 US$ nach heutigem Wert) kostete, aber letztlich verkaufte sich die Apple-II-Reihe 6 Mio. mal über einen Zeitraum von 16 Jahren. Damit konnte sich Apple im Markt festigen und weitere Entwicklungen mit gutem Puffer finanzieren. Selbst der Macintosh konnte ihn nicht sofort ablösen, sodass beide Reihen für fast ein Jahrzehnt liefen.

