  Heute vor 48 Jahren entdeckte James W. Christy den ersten und größten Mond von Pluto, Charon. Als er den damals Noch-Planeten untersuchte, bemerkte er eine Ausbuchtung, welcher periodisch erschien und verschwand:

  ![Zwei Negativaufnahmen von Pluto nebeneinander, jeweils ein körniger schwarzer Fleck: Auf der linken trägt er oben eine Ausbuchtung — den Mond Charon —, auf der rechten fehlt sie.](fakten/2026-06-22-1.avif)

  Daraus leitete er korrekt ab, dass das ein Satellit von Pluto sein muss. Zweifel an der Existenz Charons wurden beseitigt, als Pluto und Charon zwischen 1985 und 1990 einander wiederholt bedeckten. Das war ein glücklicher Zufall, dass dies so bald nach Charons Entdeckung stattfand, weil das nur in zwei Abschnitten innerhalb der 248-jährigen Umlaufperiode von Pluto geschieht.
