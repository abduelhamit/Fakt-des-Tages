  Heute vor 11 Jahren wurde nach fünf Jahren Renovation die Burg Himeji, die größte und meistbesuchte Burg Japans wiedereröffnet. Die Dächer und Wände der Burg wurden renoviert, wodurch die durch Verschmutzung dunkel gefärbten Dächer wieder ihren weißen Originalzustand erhielten. Sie befindet sich in der Stadt Himeji in der japanischen Präfektur Hyōgo, ist eines der ältesten erhaltenen Bauwerke aus dem Japan des 17. Jahrhunderts und wurde 1993 von der UNESCO als Weltkulturerbe anerkannt.

  Fun Facts: Ich war vor 2½ Jahren auch mal da, bin aber wegen der ewig langen Schlange nicht rein. Stattdessen habe ich das in Lego zuhause. Und mit 13 Automaten nebeneinander war das die höchste Ansammlung an Automaten, die ich bisher im Freien gesehen habe.

  ![Die Burg Himeji: der weiße, mehrstöckige Hauptturm mit geschwungenen Ziegeldächern auf einer Natursteinmauer, davor grüne Bäume.](fakten/2026-03-27-1.avif)
  _Foto: [Nikos Kitsakis](https://commons.wikimedia.org/wiki/File:Himeji_castle_in_may_2015.jpg), [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)_
  ![Ein Lego-Modell derselben Burg auf einem Regalbrett, mit Kirschblütenbäumchen und der Aufschrift „Himeji Castle“ auf der Grundplatte.](fakten/2026-03-27-2.avif)![Rund ein Dutzend Getränkeautomaten stehen nebeneinander auf einem Platz im Freien, davor Bänke und Passanten.](fakten/2026-03-27-3.avif)
