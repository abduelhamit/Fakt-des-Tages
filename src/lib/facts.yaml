  Heute vor 100 Jahren wurde die Hercílio-Luz-Brücke in Florianópolis nach einer Bauzeit von über drei Jahren eröffnet. Sie ist die größte Hängebrücke Brasiliens und war bis 1967 die größte Südamerikas. Die Brücke hat eine Gesamtlänge von 819,5 m und verbindet die Insel Santa Catarina zum Festland. Sie gilt als Wahrzeichen der Stadt Florianópolis und wurde heute vor 29 Jahren unter Denkmalschutz gestellt.

  ![Die Hercílio-Luz-Brücke in der Abenddämmerung: die beleuchtete Hängebrücke über dem Wasser, dahinter die Lichter von Florianópolis.](fakten/2026-05-13-1.avif)
