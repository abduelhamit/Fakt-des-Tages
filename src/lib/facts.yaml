  Heute vor 67 Jahren wurden erstmals die Grammy Awards für herausragende Leistungen in der Musikindustrie verliehen. Es gab die Idee, sie „Eddies“ zu nennen, um Thomas Edison, den Erfinder des Phonographen zu ehren, bevor man sich auf den namensgebende Grammophon als Trophäe geeinigt hatte. Die erste Gala fand simultan im Beverly Hilton Hotel in Kalifornien und im Park Sheraton Hotel in New York statt. Frank Sinatra wurde vier Male für seine musikalische Leistung nominiert, gewann jedoch einen Preis für [sein Album-Cover von Only the Lonely](https://upload.wikimedia.org/wikipedia/en/9/9e/Sinatraonlythelonely.jpg "https://upload.wikimedia.org/wikipedia/en/9/9e/Sinatraonlythelonely.jpg").

  ![Ein goldenes Grammophon, die Grammy-Statuette, auf schwarzem Sockel in einer Vitrine, auf dem Schild „KENNY ROGERS, BEST COUNTRY VOCAL MALE – 1977, ‚LUCILLE‘“.](fakten/2026-05-04-1.avif)
  _Foto: [Thank You (23 Millions+) views from Los Angeles, USA](https://commons.wikimedia.org/wiki/File:Grammy_Award_trophies_-_Kenny_Rogers_%22The_Gambler%22_%28cropped%29.jpg), [CC BY 2.0](https://creativecommons.org/licenses/by/2.0/)_
