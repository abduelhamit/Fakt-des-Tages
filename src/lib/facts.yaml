  Heute vor 50 Jahren ist der französische Jurist und Diplomat René Cassin gestorben. Er war Mitverfasser der Allgemeinen Erklärung der Menschenrechte der Vereinten Nationen ([Artikel 1 steht an der Wand des Parlamentsgebäudes in Wien](https://upload.wikimedia.org/wikipedia/commons/3/3f/Menschenrechte_Wien.jpg "https://upload.wikimedia.org/wikipedia/commons/3/3f/Menschenrechte_Wien.jpg")) und Friedensnobelpreisträger des Jahres 1968.

