  Heute vor 50 Jahren began Ford mit der Produktion des ersten Ford Fiesta. Das Fahrzeug war eine Neuentwicklung und der erste kompakte Kleinwagen von Ford. Zusammen mit Audi 50, VW Polo und später Opel Corsa brachte es in Deutschland ab Mitte der 1970er-Jahre die Trendwende hin zu kompakteren Fahrzeugen. Ford Fiesta genoss einen langanhaltenden Erfolg über acht Modellgenerationen, bis am 7. Juli 2023 der letzte Ford Fiesta im Ford-Werk Köln vom Band rollte.

  ![Ein orangeroter Ford Fiesta der ersten Generation, ein Dreitürer mit verchromten Stoßstangen und dem Kennzeichen „GAP-JN 2“, am Straßenrand vor einem Haus mit Holzbalkon.](fakten/2026-05-11-1.avif)
