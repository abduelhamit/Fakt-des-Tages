  Heute vor 30 Jahren wurde in Nordamerika Crash Bandicoot für die PlayStation 1 veröffentlicht; zwei Monate später dann auch für Europa. Der genetisch ausgebaute Beuteldachs war vom Entwicklerstudio Naughty Dog als Maskottchen für die noch erst ein Jahr alte Sony PlayStation gedacht, da Nintendo mit Mario und Sega mit Sonic schon welche hatten, aber Sony nicht.

  Das Spiel brachte die Konsole an ihre Grenzen: Damals war es noch üblich, dass das Spiel das ganze Level in den Arbeitsspeicher (RAM) lud, bevor es losgeht. Die detaillierten Level von Crash brauchen über 10 MB Speicher; jedoch hat die PS1 nur 2 MB RAM. Die Lösung war, die Daten in kleine Stücke zu teilen, diese schlau auf die CD-ROM zu verteilen und das Level während des Spielens durchgängig nachzuladen. Es gab die Befürchtung, dass das Spiel dadurch das Laufwerk zerstören könnte, da der Abschluss des Spiels schätzungsweise 120.000 CD-Zugriffe bräuchte, aber der Mechanismus des Laufwerks lediglich für 70.000 Zugriffe ausgelegt war. Letztlich hat die Konsole das aber ohne nennenswerte Schwierigkeiten gepackt.

  ![Die nordamerikanische PlayStation-Packung von 1996: Crash Bandicoot bricht mit gefletschten Zähnen durch eine aufgerissene Papierwand, dahinter eine Dschungelruine; oben der Schriftzug CRASH BANDICOOT auf Holzbrettern, unten die Logos von Naughty Dog, Universal Interactive Studios und Sony Computer Entertainment.](fakten/2026-09-09-1.avif)
  _Packung: Sony Computer Entertainment, Universal Interactive Studios, Naughty Dog, 1996_
