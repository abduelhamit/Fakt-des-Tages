  Heute vor 29 Jahren wurde die Domain google.com registriert. Davor erreichte man die Suchmaschine über Stanfords Domains google.stanford.edu und z.stanford.edu. Sergey Brin und Larry Page gründeten aber ihr Unternehmen Google offiziell erst ein Jahr später. Die Besonderheit von Google war der PageRank-Algorithmus, der die für eine bestimmte Webseite gesammelten Backlink-Daten in ein Maß für deren Bedeutung umwandelte. Die beiden Gründer erkannten, dass eine auf PageRank basierende Suchmaschine bessere Ergebnisse liefern würde als die damals existierenden Suchmaschinen, die Ergebnisse danach bewerteten, wie oft der Suchbegriff auf einer Seite vorkam.

  Damals sah Googles Speicherplatz noch so aus:

  ![Die frühe Festplatten-Einhausung von Google, gebaut aus bunten Duplo-Steinen: ein schrankförmiger Kasten in Rot, Blau, Gelb und Grün, vorne zwei schwarze Lüftergitter übereinander, obenauf zwei Lego-Figuren. Das Ganze steht in einer Vitrine in Stanford.](fakten/2026-09-15-1.avif)
  _Foto: [Christian Heilmann](https://commons.wikimedia.org/wiki/File:The_first_Google_computer_at_Stanford_%28cropped%29.jpg), [CC BY 2.0](https://creativecommons.org/licenses/by/2.0/)_
