  Heute vor 180 Jahren entdeckten der deutsche Astronom Johann Gottfried Galle und sein Assistent, der deutsch-dänische Astronom Heinrich Louis d’Arrest, Neptun, den achten und äußersten Planeten unseres Sonnensystems (Anm. d. Red.: Pluto ist kein Planet, siehe [Fakt vom 24.08.](2026-08-24)). Dafür nutzten sie die Ergebnisse des französischen Mathematikers Urbain Le Verrier, der kurz zuvor mithilfe der Bahnstörungen des Uranus die Position Neptuns vorausberechnen konnte.

  Mit einem Durchmesser von knapp 50.000 Kilometern hat Neptun fast den vierfachen Erddurchmesser und das rund 58-fache Erdvolumen. Nach Jupiter, Saturn und Uranus ist Neptun der viertgrößte Planet des Sonnensystems. Zusammen mit Uranus bildet Neptun die Untergruppe der Eisriesen, also der Riesenplaneten, die hauptsächlich aus flüchtigen chemischen Verbindungen wie Wasser, Ammoniak oder Methan bestehen und eine mächtige Atmosphäre aus leichten Elementen besitzen. Der Riesenplanet ist nach Neptun benannt, dem römischen Gott des Meeres und der Fließgewässer. Sein Zeichen ♆ ist ein stilisierter Dreizack, die Waffe des Meeresgottes.

  ![Der Planet Neptun, aufgenommen von der Raumsonde Voyager 2: eine fast bildfüllende, milchig blassblaue Kugel vor schwarzem Weltraum, zum Rand hin etwas kräftiger blau. Knapp oberhalb der Mitte helle weiße Wolkenschlieren und daneben, nur schwach erkennbar, der längliche Große Dunkle Fleck; über die untere Hälfte ziehen blasse helle Bänder, nahe dem unteren Rand liegt ein kleiner weißer Wolkenfleck. Die Farben dieser Aufnahme sind nachträglich kalibriert — Neptun wirkt darauf deutlich blasser als auf den bekannten kontrastverstärkten Bildern.](fakten/2026-09-23-1.avif)
