  Heute vor 900 Jahren fand die Zweite Schlacht bei Chlumec statt. Dabei siegte Soběslav I. über König Lothar III. und dessen Verbündeten Otto den Schwarzen. Grund für die Schlacht war ein Erbstreit um das Herzogtum Böhmen… Manches ändert sich wohl nie.

