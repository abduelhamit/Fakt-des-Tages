  Heute vor 40 Jahren startete das erste Modul der sowjetischen Raumstation Mir (russisch Мир ‚Frieden‘ oder ‚Welt‘) ins All. Die Raumstation umkreiste die Erde über 15 Jahre lang bis zum kontrollierten Absturz 2001.

