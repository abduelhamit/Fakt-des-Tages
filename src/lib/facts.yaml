  Heute vor 70 Jahren wurde TAT-1, das erste transatlantische Telefonkabel, zwischen Schottland und Neufundland in Betrieb genommen.

  Das erste Transatlantikkabel wurde knapp 100 Jahre zuvor gelegt. Mit solchen Kabeln waren aber nur telegrafische Verbindungen möglich. Die Technologie für ein derart langes Unterseetelefonkabel (Elektronenröhren für die Verstärker, Polyethylen statt Guttapercha für die Isolierung, Trägerfrequenzverfahren) stand erst in den 1940er Jahren zur Verfügung. Die Kosten von 120 Millionen britischen Pfund wurden von der britischen Postbehörde, AT&T sowie zu zehn Prozent von der Canadian Overseas Telecommunications Corporation getragen.

  Der Betrieb des TAT-1 wurde 1978 eingestellt. 2006 wurde es zu einem IEEE-Meilenstein ernannt.

  ![Ein Stück des TAT-1-Tiefseekabels als Ausstellungsstück, senkrecht auf einem Acrylsockel: Die Lagen sind stufenweise abgetragen, sodass das Kabel nach oben hin immer dünner wird wie ein Turm — vom schwarzen Außenmantel über die Stahlarmierung und weitere Isolierschichten bis zum blanken Kupferleiter an der Spitze. Auf dem Mantel ein aufgedrucktes Band mit der Aufschrift ‚Transatlantic Telephone, Deep Sea Type, Submarine Cables Limited, Ocean Works, Erith‘.](fakten/2026-09-25-1.avif)
  _Foto: [Geni](https://commons.wikimedia.org/wiki/File:TAT_1_cable.JPG), [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)_
