  Heute vor 19 Jahren wurde das siebte und letzte Band der Harry-Potter-Reihe, Harry Potter und die Heiligtümer des Todes, veröffentlicht. Ich überspringe den Inhalt und gehe direkt zu den Zahlen: Bereits vor dem Erscheinungstermin wurde das Buch weltweit 1,6 Millionen Mal vorbestellt; in Deutschland waren es 450.000 Vorbestellungen. Die Verkaufszahlen schlugen den Rekord des Vorgängers: In den ersten 24 Stunden wurden 8,3 Millionen Exemplare verkauft, nach 10 Tagen waren es sogar 11,5 Millionen, in den ersten fünf Jahren wurden weltweit 44 Millionen Exemplare verkauft. Bis heute sind's schätzungsweise 50 Millionen Exemplare, womit es zu den meistverkauften Büchern der Welt zählt.

