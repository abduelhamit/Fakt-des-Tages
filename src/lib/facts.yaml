  Heute vor 166 Jahren nahm Édouard-Léon Scott de Martinville mit seinem Phonautographen sich selbst beim Singen von "Au clair de la lune" auf und produzierte so [die älteste bekannte Stimmaufnahme](https://upload.wikimedia.org/wikipedia/commons/2/2a/1860-Scott-Au-Clair-de-la-Lune-05-09.ogg "https://upload.wikimedia.org/wikipedia/commons/2/2a/1860-Scott-Au-Clair-de-la-Lune-05-09.ogg"). Er konstruierte drei Jahre zuvor die Vorrichtung, aber an eine Tonwiedergabe wurde noch nicht gedacht, weder mit dem Gerät selbst, noch mit einem speziellen Wiedergabegerät; es sollte nur die Zusammensetzung des Schalls optisch erkennbar sein. Erst 2008 konnte eine Tonaufzeichnung jenes Phonautographen von 1860 rekonstruiert und hörbar gemacht werden.

  ![Historischer Stich von Scotts Phonautograph: ein großer, fassförmiger Schalltrichter auf einem verschnörkelten gusseisernen Gestell, an seinem schmalen Ende eine Walze mit Handkurbel.](fakten/2026-04-09-1.avif)
2026-04-10: |-
  Heute vor 165 Jahren gründete William Barton Rogers, ein damals bekannter Naturforscher, das Massachusetts Institute of Technology, kurz MIT. Er wollte eine unabhängige Universität schaffen, mit Ausrichtung auf die Erfordernisse eines zunehmend industrialisierten Amerika. Wegen des Bürgerkrieges konnten die ersten Studierenden erst vier Jahre später aufgenommen werden. In den späten 1990er-Jahren war Risikokapital im Überfluss vorhanden, sodass sich rund um das MIT ein Netz aus Hightech-Startups angesiedelt hat. Die Hochschule ist zudem Gründungsorganisation und Sitz des World Wide Web Consortium (W3C), des Standardisierungsgremiums für das World Wide Web.

  ![Der Great Dome des MIT bei Nacht: die angestrahlte Kuppel über der Säulenfassade mit erleuchteten Fenstern, davor der dunkle Rasen von Killian Court.](fakten/2026-04-10-1.avif)
  _Foto: [Fcb981, bearbeitet von Thermos](https://commons.wikimedia.org/wiki/File:MIT_Dome_night1_Edit.jpg), [CC BY-SA 3.0](https://creativecommons.org/licenses/by-sa/3.0/)_
2026-04-13: |-
  Heute vor 73 Jahren veröffentlichte Ian Fleming den Roman Casino Royale, das Debüt von James Bond. Er begann mit dem Schreiben ein Jahr zuvor auf seinem Anwesen Goldeneye in Oracabessa, Jamaica kurz vor seiner Hochzeit mit seiner schwangeren Freundin Ann Charteris, um sich von der bevorstehenden Trauung abzulenken. Seitdem verfasste Fleming dort jedes Jahr im Januar und Februar alle seine Bond-Romane, bis er 1964 im Alter von 56 Jahren an den Folgen einer Herzerkrankung starb.

  ![Der Umschlag der Erstausgabe von „Casino Royale“: auf grauem Grund rote Herzen mit Blutstropfen, in der Mitte ein Herz in einem goldenen Lorbeerkranz mit den Bändern „A Whisper of Love“ und „A Whisper of Hate“, darüber der Titel und darunter „by Ian Fleming“ in Goldschrift.](fakten/2026-04-13-1.avif)
  _Einband: Ian Fleming, Jonathan Cape 1953_
2026-04-14: |-
  Heute vor 56 Jahren war die Geburtsstunde des Satzes: "Houston, we have a problem", nachdem ein explodierter Sauerstofftank der Apollo 13 die Elektronik beschädigt hatte. [Der genaue Wortlaut war etwas anders](https://en.wikipedia.org/wiki/File:Apollo13-wehaveaproblem.ogg "https://en.wikipedia.org/wiki/File:Apollo13-wehaveaproblem.ogg"); das Zitat, wie wir's heute kennen, stammt aus dem Film "Apollo 13" aus dem Jahr 1995. Heutzutage bereitet [Outlook Probleme auf dem Weg zum Mond](https://www.heise.de/news/Artemis-2-Outlook-verursacht-nicht-nur-auf-der-Erde-Probleme-11245530.html "https://www.heise.de/news/Artemis-2-Outlook-verursacht-nicht-nur-auf-der-Erde-Probleme-11245530.html"). Wie das in Zukunft genau dramatisiert wird, wird sich noch zeigen; die Serie "Space Force" gab uns [schon vor drei Jahren einen Vorgeschmack](https://www.youtube.com/watch?v=xDLvUqhwHZc "https://www.youtube.com/watch?v=xDLvUqhwHZc") darauf.

  ![Körnige Schwarz-Weiß-Aufnahme des abgetrennten Servicemoduls von Apollo 13 vor dem schwarzen All: An einer Seite fehlt eine Verkleidungsplatte, darunter liegen zerrissene Leitungen und Geräte frei.](fakten/2026-04-14-1.avif)
2026-04-15: |-
  Heute vor 75 Jahren eröffnete Hermann Gmeiner im österreichischen Imst in Tirol das erste SOS-Kinderdorf namens Haus Frieden. Zwei Jahre zuvor gründete er den Verein mit der Idee, verwaisten und verlassenen Kindern in der Nachkriegszeit ein neues Zuhause zu geben. Dafür investierte er 600 Schilling in die ersten Spendenaufrufe, die dazu aufforderten, den Verein mit einem Schilling monatlich zu unterstützen. Diese Aufrufe fanden eine unerwartete Resonanz.

  ![Schwarz-Weiß-Foto aus dem SOS-Kinderdorf Imst: weiß verputzte Häuser mit Holzbalkonen unter hohen Kiefern, im Vordergrund spielende Kinder, eines mit einem Reifen, dahinter ein Berg.](fakten/2026-04-15-1.avif)
  _Foto: [Willy Pragher](https://commons.wikimedia.org/wiki/File:Imst-_SOS_Kinderdorf,_H%C3%A4user_%28mit_spielenden_Kindern_im_Vordergrund%29_-_LABW_-_Staatsarchiv_Freiburg_W_134_Nr._065698.jpg), [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)_
2026-04-16: |-
  Heute vor 54 Jahren hob die NASA-Mission Apollo 16 in Florida ab. Sie war die vorletzte Mission innerhalb des amerikanischen Apollo-Programms, die fünfte bemannte Landung auf dem Erdmond und die zweite erweiterte Mission mit verlängertem Mondaufenthalt und dem Einsatz des Mondautos Lunar Roving Vehicle. Es war das erste Mal, dass eine Landung in einer zerklüfteten Hochlandregion durchgeführt wurde. Mit dem Rover führten die Astronauten sogar einen "Grand Prix" durch, um die Wendigkeit bei geringer Schwerkraft zu testen. [Das sah nach Spaß aus.](https://commons.wikimedia.org/wiki/File:Ap16_rover.ogv "https://commons.wikimedia.org/wiki/File:Ap16_rover.ogv")

  ![John Young springt auf der grauen Mondoberfläche neben der US-Flagge in die Höhe und salutiert, hinter ihm die Mondlandefähre und das Mondauto vor schwarzem Himmel.](fakten/2026-04-16-1.avif)
2026-04-17: |-
  Heute vor 62 Jahren feierte der Ford Mustang seine offizielle Weltpremiere auf der Weltausstellung in New York. Ford rechnete mit 100.000 Verkäufen jährlich. Im ersten Jahr wurden über 400.000 Einheiten verkauft; der millionste Mustang wurde innerhalb von zwei Jahren verkauft. Damit hatte der Mustang den erfolgreichsten Start in den Automarkt seit dem 1927er Model A und begründete so die Kategorie der Pony-Cars, sportliche und kompakte Coupés.

  ![Der erste Serien-Mustang, ein weißes Ford-Mustang-Cabrio mit offenem Verdeck, im Museum ausgestellt, vorne ein Nummernschild aus Neufundland mit der Nummer „3-664“.](fakten/2026-04-17-1.avif)
  _Foto: [Alvintrusty](https://commons.wikimedia.org/wiki/File:Ford_Mustang_serial_number_one.jpg), [CC BY-SA 3.0](https://creativecommons.org/licenses/by-sa/3.0/)_
