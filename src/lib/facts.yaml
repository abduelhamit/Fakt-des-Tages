  Heute vor 175 Jahren patentierte Isaac Singer die "Singer’s Nummer 1", die als "erste praktische Nähmaschine der Welt" vermarktet wurde. Das Problem: Nur fünf Jahre zuvor patentierte Elias Howe auch eine Nähmaschine. Wegen dem Patent und den Maschinen, die schon verkauft wurden, gab es einen jahrelangen Rechtsstreit zwischen den Beiden, den am Ende 1854 Howe für sich gewann. Um weitere solche Schwierigkeiten in der frisch aufblühenden Nähmaschinenindustrie zu vermeiden, gründeten Howe, I. M. Singer & Co., Wheeler & Wilson und Grover & Baker 1856 die Sewing Machine Combination, wo sie neun ihrer Patente in einen Topf warfen und damit die erste Patentgemeinschaft der USA gründeten.

