  Heute vor 20 Jahren verlor Pluto seinen Status als Planeten. Die Debatte fing aber schon 1801 an, als Ceres entdeckt wurde, der sich Pluto ähnelt. In den 2000ern wurden mindestens drei weitere solcher Himmelskörper entdeckt (Quaoar, Sedna und Eris), sodass man sich die Frage stellen musste, ob man die alle als Planeten bezeichnen möchte. Die Internationale Astronomische Union (IAU), eine weltweite Vereinigung von Astronomen mit Sitz in Paris, begann schon acht Tage bevor Pluto seinen Status verlor mit dem ersten Vorschlagsentwurf, wie Planeten definiert werden sollten. Nach zwei weiteren Vorschlagsrunden wurde der dritte, finale Entwurf zur Wahl gestellt und dafür gestimmt. Laut dieser neuen Definition ist ein Planet ein Himmelskörper, der (a) die Sonne umkreist, (b) über genügend Masse verfügt, damit seine Eigenanziehungskraft die Kräfte starrer Körper überwindet und er eine Form im hydrostatischen Gleichgewicht (nahezu Kugelgestalt) annimmt, und (c) die Umgebung seiner Umlaufbahn bereinigt hat. Punkt C ist der Knackpunkt bei Pluto: Er befindet sich im Kuipergürtel und teilt sich seine Bahn mit anderen Objekten wie Eris. Daher wurde Pluto, wie die vorher erwähnten Körper auch, als Zwergplanet eingestuft und ist nicht mehr neben den acht Planeten eingereiht.

  ![Pluto als ganze Kugel in natürlichen Farben vor schwarzem All, beige und braun, mit der großen hellen, herzförmigen Ebene Sputnik Planitia.](fakten/2026-08-24-1.avif)
