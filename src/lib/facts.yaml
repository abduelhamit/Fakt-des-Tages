  Heute vor 44 Jahren startete Cheers mit ihrer Pilotfolge auf NBC. Die US-Sitcom spielt im Cheers, einer kleinen Bar in Boston, wo der Besitzer mit seinen Angestellten und Gästen Dinge des „alltäglichen“ Lebens erlebt. In Deutschland startete die Serie im Jahr 1985 unter dem Titel Prost Helmut im ZDF. Die Synchronisation entsprach jedoch nicht dem Original und auch die Hauptfiguren wurden umbenannt. In dieser Version hatte die Serie nur mäßigen Erfolg und wurde bereits nach 13 Folgen eingestellt. Erst zehn Jahre später, in den Jahren 1995 und 1996, zeigte RTL sämtliche Episoden in einer überwiegend originalgetreuen Synchronfassung unter dem Titel Cheers.

  ![Das Serienlogo von Cheers: Der Schriftzug steht in einer üppig geschwungenen Schreibschrift, die Buchstaben in einem Verlauf von hellem Gold zu Kupferbraun, jeder mit dicker schwarzer Kontur, plastischem Schlagschatten und feinen Schraffurlinien als Schattierung. Der Abstrich des letzten s schwingt als langer Bogen unter dem ganzen Wort nach links zurück.](fakten/2026-09-30-1.avif)
  _Logo: Paramount Television_
