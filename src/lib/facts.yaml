  Heute vor 34 Jahren wurde in Bloomington (Minnesota) die Mall of America eröffnet. An ihrer Stelle stand früher das Metropolitan Stadium. Mit einer Brutto-Grundfläche von über 520.000 m² ist sie die größte Shopping-Mall der USA und war die zweitgrößte weltweit; Platz 1 belegte damals die CentralWorld in Bangkok. Die Mall of America bietet den jährlich über 40 Mio. Besuchenden über 500 Shops an. Außerdem gibt's einen Indoor-Freizeitpark (Nickelodeon Universe), ein Aquarium (Underwater World), ein Kino mit 14 Sälen, ein Lego Imagination Center, ein Dinosaurier-Museum, Diskotheken und einen NASCAR-Simulator. Durch diese Einrichtungen wird die Mall of America auch als Urban Entertainment Center angesehen.

