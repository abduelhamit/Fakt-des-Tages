  Heute vor 125 Jahren wurde in Ambroise Vollards Pariser Galerie die erste Ausstellung des 19 Jahre alten spanischen Malers Pablo Picasso eröffnet. Picasso, neben Georges Braque einer der maßgebenden Gründer des Kubismus, hatte Vollard als Förderer in Picassos Blauer und Rosa Periode; den nachfolgenden kubistischen Werken stand Vollard nicht so positiv gegenüber. Picassos Vater war freischaffender Maler und Lehrer, sodass er schon mit 7 Jahren anfing zu malen und mit 14 Jahren an der Kunstakademie war. Mit 26 fing er mit einem neuen Stil an, für den er weltweit bekannt werden sollte: Kubismus zeichnet sich durch die Zerlegung des Motivs in Grundformen wie z. B. Würfel (daher der Begriff) und durch mehrere Perspektiven gleichzeitig aus. Dadurch fällt die klassische Dreidimensionalität weg; das Bild wirkt flach und fragmentiert.

  ![Schwarz-Weiß-Porträt des jungen Pablo Picasso mit dunklem, seitlich gescheiteltem Haar, Cordjacke und kariertem Halstuch, oben rechts handschriftlich „Picasso 1904“.](fakten/2026-06-24-1.avif)
