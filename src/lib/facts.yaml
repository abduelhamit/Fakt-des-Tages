  Heute vor 33 Jahren gab das Direktorium des europäischen Kernforschungszentrums CERN das World Wide Web kostenlos für die Öffentlichkeit frei. Darunter fällt auch die Sprache HTML und das Protokoll HTTP, die Basis für jede Webseite, auch diese. Ohne diesen Moment ist es gut möglich, dass wir nicht ein Internet hätten, sondern ein fragmentiertes Netz mit vielen Insellösungen und Patentgebühren, wenn's überhaupt so groß geworden wäre wie heute.

  ![Der erste Webserver, ein schwarzer NeXT-Würfel, mit Monitor und Tastatur in einer Vitrine; auf dem Gehäuse ein teils abgerissener CERN-Aufkleber mit der roten Handschrift „This machine is a server. DO NOT POWER IT DOWN!!“, davor ein aufgeschlagenes Buch und ein Ausdruck von „Information Management: A Proposal“.](fakten/2026-04-30-1.avif)
  _Foto: [Coolcaesar](https://commons.wikimedia.org/wiki/File:First_Web_Server.jpg), [CC BY-SA 3.0](https://creativecommons.org/licenses/by-sa/3.0/)_
