  Heute vor 60 Jahren besiegte Borussia Dortmund mit 2:1 nach Verlängerung den FC Liverpool im Finale des Europapokals der Pokalsieger und wurde erster deutscher Europapokalsieger. Torschützenkönig wurde Lothar Emmerich von Borussia Dortmund mit 14 Toren. Der Europapokal der Pokalsieger war ein Wettbewerb der UEFA, der zwischen 1960 und 1999 ausgetragen wurde. Da der Wettbewerb vor allem in den 1990er Jahren deutlich an Renommee verloren hatte, wurde der Europapokal der Pokalsieger abgeschafft und mit dem UEFA-Cup zusammengelegt.

  ![Schwarz-Weiß-Foto eines Fußballspiels bei Flutlicht: Lothar Emmerich im weißen Trikot und dunkler Hose landet nach einem Hechtsprung mit beiden Händen auf dem Rasen, die Beine noch in der Luft, dahinter die dunklen Zuschauerränge.](fakten/2026-05-05-1.avif)
