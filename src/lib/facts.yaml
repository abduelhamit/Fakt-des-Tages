  Heute vor 115 Jahren stiehlt der Italiener Vincenzo Peruggia die Mona Lisa. Durch dieses Ereignis wurde das Gemälde erst zu dieser großen Berühmtheit.

  Peruggia, der zu dieser Zeit wegen Renovierungsarbeiten als Glaser im Louvre tätig war, hatte sich in einem Schrank versteckt, sich über Nacht im Museum einschließen lassen, das Bild aus dem Rahmen gelöst und am Folgetag, vermutlich eingewickelt in seinen Kittel, aus dem Museum geschmuggelt. Zunächst gerieten Guillaume Apollinaire und Pablo Picasso (ja, der Picasso) in den Verdacht, die Mona Lisa gestohlen zu haben. Das Gericht konnte aber ihnen keine Mittäterschaft an dem Diebstahl der Mona Lisa nachweisen und die Künstler wurden freigesprochen. Weitere Ermittlungen der Polizei gingen ins Leere; der Diebstahl blieb mehr als zwei Jahre lang ungeklärt. Viele Bürger gingen in den Louvre, um sich die leere Stelle an der Wand anzusehen, während fliegende Händler vor dem Louvre Postkarten und Reproduktionen der Mona Lisa verkauften. War das Bild schon vor dem Diebstahl bekannt gewesen, so wurde es nun nach seinem Verschwinden wirklich berühmt.

  Bisher hatte Peruggia die Mona Lisa in seiner Wohnung, letztlich aber wollte er sie „heim“ nach Italien bringen. Daher versuchte er, das Bild in Florenz an den Kunsthändler Alfredo Geri zu verkaufen. Geri informierte Giovanni Poggi, den Direktor der Uffizien, und bekundete sein Interesse. Peruggia kam nach Florenz und zeigte das Bild in seinem Hotelzimmer. Nachdem sich Geri und Poggi sicher waren, dass sie das Original vor sich hatten, überredeten sie Peruggia, in seinem Hotel auf das Geld zu warten und riefen die Polizei. Die Reaktion der Öffentlichkeit war heftig. Italienische Nationalisten verlangten, dass „ihre“ Mona Lisa „zu Hause“ bleiben solle. Die italienische Regierung versicherte zwar, dass sie die Mona Lisa an den Louvre zurückerstatten werde, aber zuerst ging das Gemälde „auf Tournee“ und wurde in Florenz, Rom und Mailand ausgestellt. Es reiste in einer eigens angefertigten, gepolsterten Kiste und mit Ehrenwache. Schließlich kehrte die Mona Lisa mit einer großen Staatszeremonie wieder nach Paris zurück.

  ![Schwarz-Weiß-Foto der leeren Wandstelle im Salon Carré des Louvre: Zwischen zwei gerahmten Gemälden ragen nur noch die vier Haken aus der Wand, an denen die Mona Lisa hing.](fakten/2026-08-21-1.avif)
  ![Schwarz-Weiß-Foto von 1913: Drei Männer in Mänteln, zwei davon mit Hut, betrachten in den Uffizien die gerahmte Mona Lisa, die auf zwei Bänken steht, rechts Museumsdirektor Giovanni Poggi.](fakten/2026-08-21-2.avif)
