  Heute gibt's zwei Fakten zum Preis von einem: Vor 30 Jahren kam die Nintendo 64 zusammen mit Super Mario 64 auf den japanischen Markt. Und vor 35 Jahren hatte Sonic the Hedgehog sein Debüt. Mario & Sonic waren für ein Jahrzehnt das ikonischste Duell in der Videospielewelt, bis der Flop der Sega Dreamcast das beendete und die beiden nun gemeinsam bei den Olympischen Spielen teilnehmen. Bis heute sind Mario für innovative und familienfreundliche Unterhaltung für jede Person und Sonic fürs verhöhnen seiner Gegner mit Schallgeschwindigkeit bekannt. Und beide haben zuletzt erfolgreich den Sprung auf die Kinoleinwand geschafft. Mal schauen, was die Zukunft bringt.

