  Heute vor 89 Jahren wurde die Golden Gate Bridge in San Francisco eröffnet. An dem Tag war es jedoch nur Fußgängern erlaubt, die Brücke zu betreten; erst am nächsten Tag war sie dann auch regulär für Autos befahrbar. Die Gelegenheit haben einige Leute genutzt, um die Ersten zu sein: Carmen und Minnie Perez waren die Ersten, die die Brücke auf Rollschuhen überquerten; Donald Bryan sprintete als Erster drüber. Und Anna Marie Anderson war mit 11 das erste Kind, was verloren gegangen ist. Sie wurde aber recht schnell wiedergefunden.

  ![Die Einladung zur Eröffnung auf gesprenkeltem cremefarbenem Papier: oben ein kleiner sepiafarbener Stich der Brücke, darunter „The Citizens of San Francisco and the Redwood Empire Counties of California request the honor of your presence to witness the ceremonies at the opening of the Golden Gate Bridge and the attendant Fiesta“, „May twenty-seventh to June second, Nineteen hundred and thirty-seven“ und die Namen der drei Gastgeber.](fakten/2026-05-27-1.avif)
