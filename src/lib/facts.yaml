  Heute vor 43 Jahren kamen in Japan zeitgleich die Nintendo Family Computer (Famicom) und die Sega SG-1000 raus, deren internationale Versionen ein paar Jahre später die Nintendo Entertainment System (NES) und die Sega Master System waren. Für Sega war's das Debüt in der Spielkonsolenbranche; Nintendo hatte mit der Color TV-Game schon einige Jahre Erfahrung. Nintendo dominierte mit knapp 62 Mio. verkauften Einheiten; Sega hatte aber mit ca. 20 Mio. Einheiten auch ganz gute Zahlen. Diese Rivalität zwischen den beiden Unternehmen lief fast 18 Jahre, bis sich Sega 2001 vom Konsolenmarkt zurückzog und seitdem nur noch Spiele für PC und andere Konsolen entwickelt; besonders interessant sind dabei die Kollaborationen mit Nintendo wie z. B. Mario und Sonic bei den Olympischen Spielen.

