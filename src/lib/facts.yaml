  Heute vor 270 Jahren erließ Friedrich II., der Große, volkstümlich „Der Alte Fritz“ genannt, den ersten der sogenannten Kartoffelbefehle, da er in Preußen große Mühe hatte, den Anbau von Kartoffeln durchzusetzen und so Hungersnöte zu verhindern. Es wird erzählt, dass er die Bauern vom Anbau überzeugte, indem er einen Kartoffelacker von Soldaten bewachen ließ und die Bauern damit zum Stehlen der vermeintlich wertvollen Pflanzen für den eigenen Anbau verleitete. Ob er diese Maßnahme wirklich ergriffen hat, ist nicht gesichert.

  ![Robert Warthmüllers Gemälde „Der König überall“: Friedrich der Große in dunklem Mantel und Dreispitz begutachtet mit seinem Gefolge die Kartoffelernte, vor ihm graben und knien Bauern auf dem Acker, im Hintergrund eine Kutsche und eine Dorfkirche.](fakten/2026-03-24-1.avif)
