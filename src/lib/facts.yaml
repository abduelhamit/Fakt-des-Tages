  Heute vor 100 Jahren überflogen der Luftfahrtpionier Umberto Nobile und die Polarforscher Roald Amundsen und Lincoln Ellsworth mit dem Luftschiff Norge den Nordpol. Es ist das erste gesicherte Erreichen des Nordpols. Der Flug startete am 10. April in Rom; nach diversen Zwischenstopps u. A. in Pulham, Oslo und Gatchina erreichten sie Ny-Ålesund, Spitzbergen, von wo dann der Flug zum Nordpol ca. 16 Stunden dauerte, bevor sie einige Zeit später in Teller, Alaska landeten.

  ![Sepiafoto des langen Luftschiffs mit der Aufschrift „Norge“ und „N1“ über dem verschneiten Ufer von Ny-Ålesund, dahinter schneebedeckte Berge; unten zieht ein Pferd einen Schlitten mit einer Holzkiste, weiter hinten steht eine Reihe von Zuschauern.](fakten/2026-05-12-1.avif)
