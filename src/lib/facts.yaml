  Heute vor 66 Jahren wurde Alfred Hitchcocks Psycho veröffentlicht, zuerst nur in New York City, weil an den Erfolg des Films gezweifelt wurde. Doch nachdem die Leute für den Film Schlange standen, strahlten immer mehr Kinos ihn aus, bis ca. drei Monate später der gesamte US ihn zeigte. Heute gilt er als Hitchcocks bestes, berühmtestes und einflussreichstes Werk. Nach Hitchcocks Tod produzierte Universal viele Nachfolger: drei Sequels, ein Remake, ein Spin-Off fürs Fernsehen und eine Fernsehserie; keine Ahnung, ob irgendwas davon was taugt. Das Original war damals sehr kontrovers und wurde international an verschiedenen Stellen zensiert und geschnitten. Erst 2020 veröffentlichte Universal zum 60. Jubiläum die komplett ungeschnittene Fassung auf Blu-ray.

