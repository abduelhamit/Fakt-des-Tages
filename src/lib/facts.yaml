  Heute vor 80 Jahren erschien die Erstausgabe der Tageszeitung Die Welt. Sie war eine Gründung der britischen Militärregierung in der Besatzungszone in Hamburg. Das Konzept der Zeitung war, Fakten scharf von Kommentaren zu trennen. Unter dem Chefredakteur, dem SPD-Mitglied und ehemaligen KZ-Insassen Rudolf Küstermeier, kollidierte das Blatt mehrmals mit den britischen Besatzungsbehörden, die Die Welt als PR-Organ nutzen wollten. Sie wurde 1953 vom Verleger Axel Springer übernommen.

  ![Das Logo der „Welt“: die Wörter „DIE“ und „WELT“ in schwarzen Antiqua-Versalien, dazwischen ein blau-weißer Globus mit Europa und Afrika.](fakten/2026-04-02-1.avif)
  _Logo: Axel Springer SE_
