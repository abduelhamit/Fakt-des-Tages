  Heute wurden zwei sehr bekannte Storys, die beide auf Papier begannen, erstmals veröffentlicht: vor 89 Jahren „Der Hobbit“ von J. R. R. Tolkien und vor 27 Jahren „Naruto“ von Masashi Kishimoto.

  Der Hobbit oder Hin und zurück (englischer Originaltitel: The Hobbit or There and Back Again) ist ein Fantasyroman für Kinder, den Tolkien zwischen 1930 (oder 1931) und 1936 schrieb. Den Hintergrund bildet die von Tolkien erdachte Mythologie in einer fiktiven Vergangenheit der Erde, wo der bekannteste Schauplatz der Kontinent Mittelerde ist. Der Hobbit war ursprünglich als Geschichte für seine Kinder konzipiert. Nach der Veröffentlichung des Herrn der Ringe nahm Tolkien am Hobbit Änderungen vor, vornehmlich um sachliche Widersprüche zu den anderen Werken aufzulösen.

  ![Der Einband der Erstausgabe von 1937: graugrünes Leinen, darauf in dunklem Blinddruck die Umrisse von Bergen, Bäumen und einem langgestreckten Drachen; auf dem Rücken steht „The Hobbit by J. R. R. Tolkien“, unten der Verlag George Allen & Unwin.](fakten/2026-09-21-1.avif)
  _Einband: J. R. R. Tolkien, George Allen & Unwin 1937_

  Naruto (jap. NARUTO -ナルト-) ist eine weltweit erfolgreiche Mangareihe, die von 1999 bis 2014 erschien und ebenfalls als Animeserie umgesetzt wurde. Auf dem Manga basieren mehrere Romanreihen, Computerspiele, Original-Video-Animationen und Filme; seit 2016 erscheint die Fortsetzung Boruto: Naruto Next Generations, die ebenfalls als Anime adaptiert wurde. Die Handlung spielt in einer fiktiven Welt, die hauptsächlich aus der Sicht von Ninjas des Dorfes Konohagakure dargestellt wird. Hauptfigur ist der junge Ninja Naruto Uzumaki, dessen Weg, ein Erwachsener und oberster Ninja seines Dorfes (Hokage) zu werden, verfolgt wird.

  ![Das Cover des ersten Naruto-Sammelbands: der blonde Ninja Naruto Uzumaki in oranger Kleidung springt mit einem Kunai in der Hand über eine stilisierte Wolke, dahinter eine grüne Kröte; darunter der bunte Schriftzug NARUTO.](fakten/2026-09-21-2.avif)
  _Cover: Masashi Kishimoto, Shueisha 2000_
