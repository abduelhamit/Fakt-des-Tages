  Heute vor 390 Jahren wurde die Universität Utrecht gegründet. Sie ist einer der ältesten und heute die größte in den Niederlanden. Besonderen Fokus legt die Universität auf Nachhaltigkeit; sie konnte die eigenen Treibhausgas-Emissionen seit 2015 um 53 % senken. Das Motto der Universität kommt aus einer wörtlichen lateinischen Bibelübersetzung und lautet „Sol Iustitiae Illustra Nos“, was übersetzt bedeutet „Möge die Sonne der Gerechtigkeit uns erleuchten“.

  ![Das Academiegebouw der Universität Utrecht: ein Backsteinbau der Neorenaissance mit hellen Steinbändern, Schieferdach und Uhrturm, davor auf einem Sockel das Standbild des Grafen Jan van Nassau.](fakten/2026-03-26-1.avif)
  _Foto: [Zairon](https://commons.wikimedia.org/wiki/File:Utrecht_Academiegebouw.jpg), [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)_
  ![Ein steinernes Relief über einem Torbogen in einer Backsteinwand: eine dunkle Sonne mit einem Wappenschild in der Mitte, umrahmt von der eingemeißelten Inschrift „SOL IVSTITIAE ILLVSTRA NOS“.](fakten/2026-03-26-2.avif)
  _Foto: [Vysotsky](https://commons.wikimedia.org/wiki/File:Sol_Iustitiae_Illustra_Nos.jpg), [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)_
