  Heute vor 202 Jahren wurde die 9. Sinfonie in d-Moll, komponiert von Ludwig van Beethoven, im Wiener Kärntnertortheater uraufgeführt. Sie ist die letzte vollendete Sinfonie des Komponisten und entstand wahrscheinlich während seiner völligen Taubheit. 1972 wurde das vokale Hauptthema des letzten Satzes (Freude schöner Götterfunken) vom Europarat zu seiner Hymne erklärt und 1985 von der Europäischen Gemeinschaft als offizielle Europahymne angenommen.

  ![Schwarz-weiße Druckgrafik der Uraufführung: Beethoven steht inmitten eines dicht gedrängten Orchesters zwischen den Geigern, neben ihm schlägt ein Dirigent den Takt, oben schauen Damen aus den Logen zu.](fakten/2026-05-07-1.avif)
