  Heute vor 40 Jahren wurde die erste Folge des ZDF-Fernsehgartens ausgestrahlt, damals von Ilona Christen moderiert. Von der Sendung, die jeweils von Mai bis September am Sonntagmittag live vom Gelände des ZDF-Sendezentrums in Mainz-Lerchenberg ausgestrahlt wird, werden jährlich etwa 20 Ausgaben produziert. Die Inhalte sind Musik- und Showauftritte von nationalen wie auch internationalen Leuten. Dazu werden Themen wie Mode, Kochen, Heimwerken, Gesundheitstipps, Gartenpflege oder Sport eingestreut. Der große und langanhaltende Erfolg brachte beim Ersten die Konkurrenzsendung "Immer wieder sonntags" hervor, die jedoch nach der Staffel 2026 aus finanziellen Gründen eingestellt werden soll.

