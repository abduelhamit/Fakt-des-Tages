  Heute vor 130 Jahren wurde das BGB verkündet, die zentrale Kodifikation des deutschen allgemeinen Privatrechts. Es regelt die Rechtsbeziehungen zwischen Privatpersonen und steht damit in Abgrenzung zum öffentlichen Recht. Unter der Leitung von Gottlieb Planck, verwandt mit Max Planck (Max's Vater war Gottliebs Cousin), über Jahre und mehrere Entwürfe entwickelt, war das Inkrafttreten drei Jahre nach der Verkündung eine kleine Revolution des Deutschen Kaiserreiches, da es die erste privatrechtliche Kodifikation war, die für das gesamte Reichsgebiet Gültigkeit besaß.

  ![Seite 195 des „Reichs-Gesetzblatts“ Nr. 21 in Fraktur: Unter „Wir Wilhelm, von Gottes Gnaden Deutscher Kaiser, König von Preußen“ beginnt das Bürgerliche Gesetzbuch mit dem „Allgemeinen Theil“ und seinen ersten drei Paragraphen.](fakten/2026-08-18-1.avif)
2026-08-19: Heute vor 25 Jahren bekam die deutschsprachige Wikipedia, einer meiner Quellen für diese Fakten des Tages, ihre 1.000ste Seite. Im März 2001 als erste weitere Sprachausgabe etwa zwei Monate nach der englischsprachigen Wikipedia gegründet, wuchs die deutschsprachige parallel zur englischsprachigen mit und zählt zur zweitgrößten nach der englischsprachigen. Es brauchte ca. 1½ Jahre, um die Marke von 10.000 Artikeln zu überschreiten, sieben Tage nachdem die englische Wikipedia den 100.000. Artikel gefeiert hatte. Heute hat die deutschsprachige Wikipedia über 3 Mio. und die englischsprachige über 7 Mio. Artikel.
