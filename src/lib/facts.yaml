  Heute vor 25 Jahren wurde die Veltins-Arena (ursprünglich Arena AufSchalke) in Gelsenkirchen eröffnet. Dank des schließbaren Dachs und verschiebbaren Spielfeldrasens dient es nicht nur als Fußballstadion, sondern auch für Konzerte, Opernaufführungen und andere Wettbewerbe. Zur Einweihung wurden der 1. FC Nürnberg und Borussia Dortmund eingeladen, die zusammen mit den Gastgebern, dem FC Schalke 04, ein Blitzturnier austrugen. Mit 2,37 Mio. Besuchern war die Arena 2014 das meistbesuchte Stadion Deutschlands. In den Jahren 2015, 2016 und 2017 belegte sie mit 2,58 Mio., 2,34 Mio. und 2,30 Mio. Besuchern den zweiten Platz hinter der Allianz Arena.

