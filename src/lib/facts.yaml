  Heute vor 25 Jahren wurde der erste Schmid Peoplemover, ein Personenbeförderungssystem, dessen Kabine sich zwischen zwei Türmen und einer dazwischenliegenden Brücke vertikal und horizontal bewegt, in Pfullingen eingeweiht. Leider wurde sie acht Jahre später stillgelegt. Zwei weitere wurden gebaut. Beide sind bis heute in Betrieb, weitere Schmid Peoplemover wurden aber nicht gebaut. Die Anlage in Altbach soll bis 2029 abgerissen und durch normale Aufzüge ersetzt werden. Die Anlage in Berlin soll ebenfalls zu unbestimmter Zeit rückgebaut werden. Immer wieder bekommt Schmid Anfragen, die er ablehnt, da sein Unternehmen mit anderen Aufträgen ausgelastet sei. Hier ein Video zu Schmid Peoplemovern: [https://www.youtube.com/watch?v=A2g4u9F9i90](https://www.youtube.com/watch?v=A2g4u9F9i90 "https://www.youtube.com/watch?v=a2g4u9f9i90")

