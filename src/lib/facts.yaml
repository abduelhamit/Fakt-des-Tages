  Heute vor 153 Jahren wurde ["Improvement in fastening pocket-openings"](https://patents.google.com/patent/US139121 "https://patents.google.com/patent/US139121") patentiert. Dabei geht's um die Verstärkung von Taschen mithilfe von Nieten, was zum ersten Mal in Lev's 501 angewendet wurde, weswegen das Patent auch als Geburtsstunde der Jeans gilt. Spätestens durch Filmstars wie James Dean und Marlon Brando wurden Jeans in den 1950er Jahren sexy und zum Fashion-Symbol; eine Welt ohne Jeans kann man sich kaum noch vorstellen.

