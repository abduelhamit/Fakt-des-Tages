  Heute vor 134 Jahren wurde der FC Liverpool gegründet, einer der erfolgreichsten Fußballvereine Englands. Mit 20 Meistertiteln ist er neben Manchester United englischer Rekordmeister, der darüber hinaus achtmal den FA Cup sowie zehnmal den Ligapokal gewann. Auf europäischer Ebene gewann der Verein sechsmal die UEFA Champions League sowie dreimal den UEFA-Pokal. Der FC Liverpool pflegt seit langer Zeit Rivalitäten mit dem Nachbarn FC Everton, mit dem ähnlich erfolgreichen Manchester United und seit jüngster Zeit mit Manchester City.

