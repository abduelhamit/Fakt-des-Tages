  Heute vor 35 Jahren feierte der Zeichentrickfilm Die Schöne und das Biest seine Premiere beim New York Film Festival. Dabei waren nur etwa 70 % der Animationen fertiggestellt; Storyboards und Bleistiftskizzen wurden anstelle der restlichen 30 % verwendet. Zwei Monate später kam der lose auf dem gleichnamigen Volksmärchen aus Frankreich basierende Film landesweit in die US-Kinos, ein Jahr danach in Deutschland. Mit einem Budget von 25 Mio. $, einem Einspielergebnis von über 450 Mio. $ und sehr guten Rezensionen ist er einer der erfolgreichsten Zeichentrickfilme Disneys. Er gewann 1992 jeweils einen Oscar für den Besten Song und die Beste Filmmusik. Er war bis Oben im Jahr 2010 der einzige Trickfilm, der für den Oscar in der Kategorie Bester Film nominiert wurde.

  ![Das Filmlogo von Die Schöne und das Biest: Auf schwarzem Grund steht „Beauty“ in geschwungener rosaroter Schreibschrift mit weit ausholenden Schnörkeln, die sich um die übrigen Wörter legen; darunter klein und grau kursiv „and the“ und daneben, in schweren grauen Buchstaben mit Steinmaserung, „BEAST“.](fakten/2026-09-29-1.avif)
  _Logo: Walt Disney Pictures_
