  Heute vor 150 Jahren war die Uraufführung von Götterdämmerung, der vierte und letzte Teil von Richard Wagners Der Ring des Nibelungen, im Festspielhaus Bayreuth, knapp sieben Jahre nach der Uraufführung des ersten Teils, Das Rheingold. Die Tetralogie basiert unter anderem auf der Nibelungensage bzw. dem Nibelungenlied; Titel und Teile der Handlung von Götterdämmerung greifen die nordische Sage Ragnarök auf. Mit einer Aufführungsdauer von etwa 15 Stunden (ein Vorabend und drei Tage), einer Orchesterbesetzung von über 100 Musikern und 34 Solisten (plus Männer- und Frauenchor) ist Der Ring des Nibelungen eines der umfangreichsten musikalischen Bühnenwerke überhaupt. An diesem Hauptwerk arbeitete Wagner mit Unterbrechungen von 1848 bis 1874.

