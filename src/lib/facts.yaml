  Heute vor 208 Jahren reichte der französische Physiker Augustin-Jean Fresnel bei der Académie des sciences (Akademie der Wissenschaften) eine Abhandlung über die Beugung des Lichts ein. Damit lieferte er starke Unterstützung für die Wellentheorie des Lichts. Das Problem: Man nahm an, dass Lichtwellen, ähnlich wie Schallwellen, ein Medium zur Ausbreitung benötigten. Dieser hypothetischer Lichtäther wurde Ende des 19. Jahrhunderts durch das Michelson-Morley-Experiment stark in Zweifel gezogen. Heute haben wir dank der speziellen Relativitätstheorie ein Konzept, was kein Äther benötigt. Jedoch wurde die Debatte um Wellentheorie des Lichts mit dem Welle-Teilchen-Dualismus aus der Quantenphysik verkompliziert.

  ![Gestochenes Schwarz-Weiß-Porträt des jungen Augustin Fresnel mit zerzaustem dunklem Haar, hohem weißem Kragen, Halsbinde und dunklem Rock.](fakten/2026-07-29-1.avif)
