  Heute vor 125 Jahren gab's am selben Tag gleich zwei Ereignisse, zwischen denen ich mich nicht entscheiden konnte:

  Der Große Saal des Moskauer Konservatoriums, einer der akustisch besten Konzertsäle, wurde mit einer Aufführung der Oper Ruslan und Ljudmila von Michail Glinka eröffnet. Das Konservatorium selbst wurde schon 35 Jahre zuvor gegründet und ist das zweitälteste in Russland nach dem Sankt Petersburger Konservatorium.

  Gleichzeitig wurde in München das Schauspielhaus eröffnet. Die Anfänge der Planung wurden zwei Jahre zuvor an das Familienunternehmen Heilmann & Littmann vergeben. Nach zehnmonatiger Bauzeit wurde das Theater am 20. April 1901 mit Johannes, einer Tragödie von Hermann Sudermann, eröffnet; 25 Jahre später zog die Münchner Kammerspiele dort ein und haben ihren Sitz bis heute.

  ![Der Große Saal des Moskauer Konservatoriums: ein cremefarbener Saal mit Balkonen, ovalen Komponistenporträts an den Wänden und der Orgel hinter der Bühne, davor rote Sitzreihen.](fakten/2026-04-20-1.avif)
  ![Das Münchner Schauspielhaus vom Hof aus: ein ockergelber Jugendstilbau mit ovalen und bogenförmigen Fenstern und einem grünen Rundbogentor.](fakten/2026-04-20-2.avif)
  _Foto: [Thomas Ledl](https://commons.wikimedia.org/wiki/File:M%C3%BCnchner_Kammerspiele_5.jpg), [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)_
2026-04-21: |-
  Heute vor 100 Jahren kam Elisabeth II. (englisch Elizabeth II) auf die Welt. Im Alter von fast 26 wurde sie die Königin des Vereinigten Königreichs und war zum Zeitpunkt ihres Todes mit knapp 71 Jahren das am längsten amtierende Staatsoberhaupt der Welt. Bedeutende politische Prozesse während ihrer Herrschaft waren die Entkolonialisierung des Britischen Weltreiches, der Kalte Krieg, der Nordirlandkonflikt und sowohl der Beitritt des Vereinigten Königreichs zur Europäischen Union als auch der Brexit. Trotz zunehmender Kritik an der Königsfamilie und gewachsener Zustimmung zur republikanischen Staatsform genoss die Monarchie unter Königin Elisabeth II. weiterhin breite Akzeptanz in der Bevölkerung.

  ![Offizielles Porträt der jungen Königin Elisabeth II.: Sie trägt Diadem, Diamantkollier, ein weißes, besticktes Abendkleid und das blaue Band des Hosenbandordens und stützt die Hände auf eine vergoldete Stuhllehne.](fakten/2026-04-21-1.avif)
2026-04-22: |-
  Heute vor 28 Jahren wurde der Disney's Animal Kingdom, ein zoologischer Themenpark, in Orlando, Florida eröffnet. Mit einer Fläche von etwa 230 Hektar ist Disney’s Animal Kingdom der flächenmäßig größte Freizeitpark der Welt. Der Magic Kingdom (der Park mit dem Disney-Schloss) würde viermal da reinpassen. Der Park widmet sich dem Schutz von Umwelt und Tieren – eine Philosophie, die auf Walt Disneys Engagement für den Naturschutz zurückgeht.

  ![Eine Giraffe im hohen, trockenen Gras zwischen Bäumen, rechts daneben ein offener Safari-Lastwagen voller Besucher.](fakten/2026-04-22-1.avif)
  _Foto: [Reinhard Link from Germany](https://commons.wikimedia.org/wiki/File:Disney's_Animal_Kingdom_%28Orlando%29_it_looks_like_an_african_landscape_%2815818499911%29.jpg), [CC BY-SA 2.0](https://creativecommons.org/licenses/by-sa/2.0/)_
2026-04-23: |-
  Heute vor 50 Jahren wurden am selben Tag drei Bands gleich drei einflussreiche Musikalben veröffentlicht: Ramones veröffentlichte ihr gleichnamiges Punk-Rock-Debüt-Album, dessen bekanntester Song wahrscheinlich [Blitzkrieg Bop](https://www.youtube.com/watch?v=268C3N2dDYk "https://www.youtube.com/watch?v=268C3N2dDYk") ist, Black and Blue von den Rolling Stones, wo sie Rock ’n’ Roll mit Reggae und Funk kombiniert haben und Too Old to Rock 'n' Roll: Too Young to Die! von Jethro Tull, welches [den gleichnamigen Song](https://www.youtube.com/watch?v=VcmJThaACHQ "https://www.youtube.com/watch?v=VcmJThaACHQ") beinhaltet und das erste Album vom Bassisten John Glascock ist.

