  Heute vor 100 Jahren spielten Louis Armstrong and His Hot Five den Jazz-Hit [Heebie Jeebies](https://music.youtube.com/watch?v=syxT6Ij-YI8 "https://music.youtube.com/watch?v=syxT6Ij-YI8") ein. In der Rückschau gilt der Song als eines der bedeutendsten Dokumente des Jazz. Darüber hinaus ist Heebie Jeebies der Song, der die Gesangstechnik des Scat populär machte und damit Scatman John den Weg ebnete.

