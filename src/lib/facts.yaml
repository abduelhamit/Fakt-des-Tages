  Heute vor 100 Jahren kam Ingvar Kamprad in Älmhult auf die Welt. Seine Initialen bilden das IK in IKEA; das E steht für den Namen des elterlichen Bauernhofs Elmtaryd und das A für den seines Heimatdorfes Agunnaryd. Seine Mutter war Schwedin, sein Vater war Deutscher und kam im Alter von drei Jahren mit den Eltern nach Schweden. Schon als Kind handelte Kamprad mit vielen verschiedenen Gütern und sagte von sich selbst, er sei wie viele Småländer ein Geizhals und Schnäppchenjäger. 1943 gründete er im Alter von 17 Jahren das Unternehmen IKEA, damals noch als Versandhandel. Ingvar Kamprad starb 2018 im Alter von 91 Jahren in seiner Geburtsgemeinde Älmhult.

  ![Ingvar Kamprad in dunklem Sakko und rotem Pullover spricht gestikulierend in einem Hörsaal, hinter ihm ansteigende Reihen von Studierenden.](fakten/2026-03-30-1.avif)
2026-03-31: |-
  Heute vor 137 Jahren wurde der Eiffelturm in Paris eröffnet, planmäßig wenige Wochen vor Eröffnung der Weltausstellung. Da die Aufzüge am Tag der Einweihung noch nicht betriebsbereit waren, stieg Gustave Eiffel die 1.710 Stufen des Turms zu Fuß hinauf, um die französische Flagge an die Spitze zu hissen. Bis zum Bau des Chrysler Buildings in New York war der Turm 41 Jahre lang das höchste von Menschenhand geschaffene Bauwerk der Welt.

  ![Schwarz-Weiß-Aufnahme des Eiffelturms über dem Gelände der Weltausstellung, im Vordergrund die Seine mit der Iéna-Brücke, dahinter die Dächer von Paris; unten der Aufdruck „Vue générale prise du Trocadero“.](fakten/2026-03-31-1.avif)
