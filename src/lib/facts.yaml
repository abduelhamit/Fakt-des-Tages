  Heute ist der 15. Jahrestag von Prinz Williams und Prinzessin Catherines Ehe. Sie vollzog sich nach anglikanischem Ritus bis auf das Geloben von „Gehorsam“. Damit führte Catherine Middleton die Tradition von Diana fort, die bei der Heirat mit Prinz Charles 1981 auf dieses Wort, welches traditionell Element des Eheversprechens im anglikanischen Ritus ist, verzichtete. Die Hochzeit galt als bedeutendes Medienereignis. Unter anderem wurde der Gottesdienst auf YouTube übertragen, welches damals noch erst seit 6 Jahren existierte.

  ![William und Catherine lächelnd in der offenen Kutsche: er in der roten Uniform der Irish Guards mit Schirmmütze, mit weißem Handschuh winkend, sie mit Diadem neben ihm.](fakten/2026-04-29-1.avif)
  _Foto: [Robbie Dale](https://commons.wikimedia.org/wiki/File:All_smiles_Wedding_of_Prince_William_of_Wales_and_Kate_Middleton.jpg), [CC BY-SA 2.0](https://creativecommons.org/licenses/by-sa/2.0/)_
