  Heute vor 103 Jahren wurde das erste 24-Stunden-Rennen von Le Mans von 33 Wagen ausgetragen. Es wurde als Langstreckenrennen geplant, bei dem die Automobilhersteller die Zuverlässigkeit der Fahrzeuge unter Beweis stellen konnten. In den ersten Jahren war es auch nur den Fahrern selbst (damals noch Zwei-Mann-Teams) erlaubt, Reparaturen mit Bordwerkzeug durchzuführen.

