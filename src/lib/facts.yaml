  Heute vor 40 Jahren wurde auf dem Messegelände Hannover die Cebit erstmals als eigenständige Messe eröffnet; vorher war sie Teil der Hannover-Messe. Die damals eine der weltweit größten Messen für Informationstechnik hatte ihren Besucherrekord 2001, wo E-Commerce immer wichtiger wurden, die neuen PCs 1-GHz-Prozessoren hatten und UMTS (3G) für Handys war eines der wichtigsten Neuerungen. Seitdem verlor die Messe jedoch stetig an Besuchenden, bis nach der Cebit 2018 verkündet wurde, sie einzustellen.

  ![Blick von oben in eine dicht gedrängte Messehalle der CeBIT 2000: Besucherströme zwischen hell beleuchteten Ständen und Bannern, links ein Stand mit der Aufschrift „ELSA Web City 2000“.](fakten/2026-03-12-1.avif)
  _Foto: [maebmij](https://commons.wikimedia.org/wiki/File:CeBIT_2000_exhibition_hall.jpg), [CC BY-SA 3.0](https://creativecommons.org/licenses/by-sa/3.0/)_
