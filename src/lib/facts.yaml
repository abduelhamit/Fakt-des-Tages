  Heute vor 121 Jahren reichte Albert Einstein "Über einen die Erzeugung und Verwandlung des Lichtes betreffenden heuristischen Gesichtspunkt" bei der renommierten Fachzeitschrift "Annalen der Physik" ein, seine erste von vier bahnbrechenden Publikationen im selben Jahr. Seine Theorie, dass Licht nicht aus kontinuierlichen Wellen, sondern aus Energiepaketen besteht, legte den Grundstein für die moderne Quantenphysik und wurde mit dem Nobelpreis geehrt, da sie erstmals die Eigenschaften von Licht als Teilchen erklären konnte.

  ![Schwarz-Weiß-Porträt des jungen Albert Einstein mit dunklem, zerzaustem Haar und Schnurrbart, in kariertem Sakko und Weste mit dunkler Krawatte.](fakten/2026-03-17-1.avif)
