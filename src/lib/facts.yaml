  Heute vor 55 Jahren stellte Lamborghini den Countach LP500, einen fahrbereiten Prototypen vor. Ursprünglich war keine Serienfertigung des Coupés geplant, aber der Prototyp fand so starken Anklang, dass man sich umentschieden hat. Das Design prägt Lamborghini bis heute.

  ![Ein hellgrüner Lamborghini Countach mit hochgeklappter Scherentür auf einem Messestand mit der Aufschrift „Polo Storico Lamborghini“.](fakten/2026-03-11-1.avif)
  _Foto: [Y.Leclercq](https://commons.wikimedia.org/wiki/File:Lamborghini_Countach_LP_500.jpg), [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)_

  _(Foto Replikat)_

  Selbst heutzutage wird über den Showcar geredet:

  > Als am 11. März 1971 auf dem Genfer Salon morgens um 10 Uhr das Tuch vom Lamborghini Countach LP500 gezogen wurde, da blieb die Welt des Automobils für ein paar Minuten stehen. Wer den gelben Prototypen auf dem Stand von Bertone sah, der wusste: Es würde nichts mehr sein wie vorher.
