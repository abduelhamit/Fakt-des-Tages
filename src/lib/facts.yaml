  Heute vor 67 Jahren schoss der US-amerikanischer Satellit Explorer 6 dieses Foto:

  ![Das erste Satellitenfoto der Erde: eine grobe, streifige Schwarz-Weiß-Aufnahme, auf der ein sichelförmiger, sonnenbeschienener Ausschnitt der Erde zu erkennen ist.](fakten/2026-08-14-1.avif)

  Das ist das erste Bild der Erde aus der Umlaufbahn von einem Satelliten. Es war nicht das erste Foto (das war [13 Jahre zuvor von der V2-Rakete](https://en.wikipedia.org/wiki/File:First_photo_from_space.jpg "https://en.wikipedia.org/wiki/File:First_photo_from_space.jpg")) und ich würde sagen auch nicht das schönste Foto seiner Zeit ([das Farbfoto der Aerobee fünf Jahre zuvor](https://en.wikipedia.org/wiki/File:First_Color_Photograph_of_Earth_from_Space.jpg "https://en.wikipedia.org/wiki/File:First_Color_Photograph_of_Earth_from_Space.jpg") finde ich wesentlich schöner), aber das waren alles Raketen, wo man hinterher den Film geborgen hat. In diesem Falle hat man das Bild per Funk übertragen; die Übertragung dauerte 40 Minuten. Damit war das ein wichtiger Schritt Richtung Messungen aus dem Weltall, was wir heutzutage z. B. für die Wettervorhersage nutzen (bei mir sollen es heute bis zu 36,7 °C werden).
