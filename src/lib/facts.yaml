  Heute vor 25 Jahren ging die deutschsprachige Wikipedia online, meine Quelle neben der englischsprachigen für diese Fakten des Tages. Sie ging zwei Monate nach der englischsprachigen Wikipedia als erste Sprachausgabe online und ist, je nach Kriterium, bis heute einer der größten bzw. die größte Ausgabe neben Englisch. Leider gibt's [die Webseite zur Feier von 25 Jahren Wikipedia](https://wikipedia25.org/ "https://wikipedia25.org/") nicht auf Deutsch. Ich hoffe, dass Wikipedia auch in Zeiten von ChatGPT nicht so sehr an Relevanz verliert wie Stack Overflow, vor zehn Jahren praktisch die Startseite eines jeden Softwareentwickelnden, nun ein Schatten ihrer selbst.

  ![Das Wikipedia-Logo: eine hellgraue Kugel aus Puzzleteilen mit Schriftzeichen vieler Schriften, oben ein fehlendes Teil, darunter „Wikipedia“ in Kapitälchen und „Die freie Enzyklopädie“.](fakten/2026-03-16-1.avif)
  _Logo: [Wikimedia Foundation](https://commons.wikimedia.org/wiki/File:Wikipedia-logo-v2-de.svg), [CC BY-SA 3.0](https://creativecommons.org/licenses/by-sa/3.0/)_
