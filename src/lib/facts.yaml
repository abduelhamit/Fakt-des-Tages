  Heute vor 250 Jahren schrieb Goethe den ersten zweier Gedichte von Wandrers Nachtlied:

  > _Der du von dem Himmel bist,_  
  > _Alle Freud und Schmerzen stillest,_  
  > _Den, der doppelt elend ist,_  
  > _Doppelt mit Erquickung füllest;_  
  > _Ach, ich bin des Treibens müde!_  
  > _Was soll all die Qual und Lust?_  
  > _Süßer Friede,_  
  > _Komm, ach komm in meine Brust!_

  …vielleicht kann mir jemand erklären, was das bedeutet; Interpretationen waren nie meine Stärke.

  ![Schwarz-Weiß-Wiedergabe eines ovalen Profilbildnisses des jungen Goethe, nach links blickend, das Haar über dem Ohr zu Locken gelegt und im Nacken zusammengebunden, mit hohem Kragen und Halstuch.](fakten/2026-02-12-1.avif)
