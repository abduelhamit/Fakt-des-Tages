  Heute vor 25 Jahren absolvierte die Boeing X-43, ein Versuchsflugzeug der NASA, ihren Erstflug, der allerdings fehlschlug. Der zweite Test knapp drei Jahre später war erfolgreich. Das Flugzeug ist unbemannt und als Lifting Body ausgelegt, was bedeutet, dass der Rumpf wesentlich für Auftrieb sorgt. Die Experimente dienten Weiterentwicklungen im Hyperschallbereich.

