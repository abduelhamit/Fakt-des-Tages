  Heute vor 125 Jahren begann in Berlin die „II. Orthographische Konferenz“, die drei Tage lief. Auf der fand unter Beteiligung von Konrad Duden (derselbe Duden wie beim gleichnamigen Wörterbuch) „Beratungen über die Einheitlichkeit der deutschen Rechtschreibung“ statt und ein amtliches Regelwerk für den Behördengebrauch wurde beschlossen. Diese Beschlüsse wurden im Laufe des nächsten Jahres durch die Regierungen umgesetzt. Kaiser Wilhelm II. war anfangs gegen einen Gebrauch der neuen Rechtschreibung. Er ließ sich jedoch überzeugen und stimmte später der Verwendung zu, bestand aber bis 1911 darauf, dass ihm vorgelegte Schriftstücke in der alten Rechtschreibung geschrieben sein mussten. Die nächste Reform gab's erst 1996; 1944 gab es einen gescheiterten Versuch.

  ![Orangebraunes Heft vor schwarzem Grund, mit Zierrahmen und Frakturschrift: „Regeln für die deutsche Rechtschreibung nebst Wörterverzeichnis“, im Auftrag des Ministeriums für Volksbildung für den Freistaat Sachsen, Generalverordnung vom 21. Oktober 1902, Alwin Huhle, Dresden.](fakten/2026-06-17-1.avif)
