  Heute vor 32 Jahren gab's das Finale Brasilien gegen Italien der FIFA-Fußball-Weltmeisterschaft in den USA. Das Spiel war ein torloses 0–0 nach 90 Minuten + 30 Minuten Verlängerung. Brasilien gewann dann beim Elfmeterschießen 3–2 gegen Italien, nachdem Roberto Baggio beim entscheidenden Elfmeter daneben schoss. Das war in der Geschichte der Weltmeisterschaft das erste Finale, was mit Elfmeterschießen entschieden wurde und bis heute das einzige Finale ohne Tore bis zum Elfmeterschießen. Vielleicht kann sich das noch am Wochenende ändern.

