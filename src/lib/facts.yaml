  Heute vor 50 Jahren wurde die Enterprise, der Prototyp des Space Shuttles, der Öffentlichkeit vorgestellt. Anwesend waren die Darsteller der Crew der Science-Fiction-Fernsehserie Star Trek (deutsch: Raumschiff Enterprise), nach deren Raumschiff die Raumfähre benannt wurde. Sie sollte ursprünglich den Namen „Constitution“ (engl. für „Verfassung“) tragen. Allerdings hatten zigtausende Fans von Star Trek in Briefen an das Weiße Haus den damaligen US-Präsidenten Gerald Ford darum gebeten, den Orbiter nach dem Raumschiff aus dieser Serie zu taufen. Gleichzeitig hat der Name „Enterprise“ Tradition in der Benennung von US-Kriegsschiffen und steht für menschliches Vorwärtsstreben.

  Die Raumfähre diente zur Erprobung der Flugfähigkeiten der Space Shuttles in der Atmosphäre. Dazu wurde sie ohne einige wichtige Komponenten wie Triebwerk und Hitzeschild gebaut und war deshalb nicht zu Flügen in den Weltraum fähig. Pläne, sie hierfür nachzurüsten, wurden aus Kostengründen nicht realisiert. Obwohl die Enterprise damit ein Prototyp blieb, wird sie von der NASA als „erstes Space Shuttle“ bezeichnet.

  ![Die Raumfähre Enterprise bei ihrer Vorstellung 1976: Der weiße Orbiter mit dunkler Bugunterseite und dem Schriftzug „Enterprise“ steht vor einer Werkshalle, davor eine Reihe von Gästen in der Kleidung der Siebzigerjahre — unter ihnen mehrere Darsteller aus Star Trek, darunter Leonard Nimoy, Nichelle Nichols und George Takei, sowie der Serienschöpfer Gene Roddenberry.](fakten/2026-09-17-1.avif)
