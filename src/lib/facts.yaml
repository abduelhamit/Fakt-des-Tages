  Heute vor 63 Jahren entstand Malaysia durch den Zusammenschluss von vier ehemaligen Teilen des Britischen Weltreichs: der Föderation Malaya, der Kronkolonie Nordborneo, der Kronkolonie Singapur und der Kolonie Sarawak. Singapur wurde ca. zwei Jahre später eine unabhängige Nation. Malaysia ist eine konstitutionelle Wahlmonarchie, basierend auf dem britischen Westminster-System, einem der ältesten parlamentarischen Systeme der Welt. Das Land hat 34 Millionen Einwohner und gilt wirtschaftlich als Schwellenland. Die Hauptstadt Malaysias ist Kuala Lumpur.

