  Heute vor 30 Jahren wurden in Japan Pokémon Rot und Grün für den Game Boy veröffentlicht und bildeten den Startschuss für eines der größten Medien-Franchises überhaupt. Heute ist Pikachu, [damals noch molliger](https://www.pokewiki.de/images/8/83/Pikachu_%28Grundset_58%29.jpg "https://www.pokewiki.de/images/8/83/Pikachu_%28Grundset_58%29.jpg"), praktisch das Maskottchen Japans und in allen möglichen Klamotten zu sehen.

