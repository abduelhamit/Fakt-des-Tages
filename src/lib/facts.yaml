  Heute vor 45 Jahren veröffentlichte das Unternehmen Sinclair den ZX81, der Nachfolger vom ZX80 und Vorgänger vom legendären ZX Spectrum. Dieser Heimcomputer war ein Preisbrecher und ebnete damit Millionen von Menschen den Weg zur Informatik, besonders im Ursprungsland, dem Vereinten Königreich, aber dank vieler Klone auch weltweit.

