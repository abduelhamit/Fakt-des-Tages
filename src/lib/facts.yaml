  Heute ist Rosenmontag! Wer nicht Teil des Karnevalszugs ist, sollte vor allem die Innenstädte Düsseldorfs, Kölns oder Aachens vermeiden. Und heute vor 20 Jahren wurde in Japan der Flughafen Kōbe eröffnet, welcher vollständig auf einer künstlichen Insel ist.

