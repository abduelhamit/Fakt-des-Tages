  Heute vor 206 Jahren wurde die Venus von Milo von einem Bauern auf der Insel Milos entdeckt. Besonders markant sind die fehlenden Arme, wo wir bis heute nicht wissen, wie sie aussahen; es wurde bloß eine Hand mit einem Apfel darin gefunden. Heute steht die Skulptur im Louvre in Paris.

  ![Die Venus von Milo im Louvre: die marmorne Frauenfigur mit nacktem Oberkörper und einem um die Hüften gerafften Gewand, beide Arme fehlen, dahinter eine dunkle Marmorwand.](fakten/2026-04-08-1.avif)

  ![Ein Marmorfragment aus demselben Fund: eine Hand, die einen apfelgroßen runden Gegenstand umschließt.](fakten/2026-04-08-2.avif)
  _Foto: [Caeciliusinhorto](https://commons.wikimedia.org/wiki/File:Venus_de_Milo_hand_2023.jpg), [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/)_
