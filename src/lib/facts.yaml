  Heute vor 10 Jahren starb Guido Westerwelle im Alter von 54 Jahren. Er war Gründungsmitglied der Jungen Liberalen, bevor er Mitglied der FDP war und als solcher Bundesaußenminister und Vizekanzler wurde. Besondere Aufmerksamkeit bekam er 2001 mit „Projekt 18“ mit dem Ziel, zur Bundestagswahl 2002 den Anteil der Wählerstimmen von 6 auf 18 % zu verdreifachen. Seine Strategie samt „Guidomobil“ ging aber nicht auf; die FDP erzielte letztlich 7,4 %.

  ![Guido Westerwelle 2013 in Nahaufnahme, mit dunkel gerahmter Brille, dunklem Mantel und gepunktetem Schal, den Blick in die Kamera gerichtet.](fakten/2026-03-18-1.avif)
  _Foto: [Dirk Vorderstraße](https://commons.wikimedia.org/wiki/File:Guido-westerwelle-fdp-hamm-2013.jpg), [CC BY 3.0](https://creativecommons.org/licenses/by/3.0/)_
