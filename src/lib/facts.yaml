  Heute vor 160 Jahren erreichte die Great Eastern ihr Ziel auf Neufundland, nachdem sie vor genau zwei Wochen von Irland aus startete. An Bord: das andere Ende des transatlantischen Telegrafenkabels, die Verbindung zwischen der „alten“ und der „neuen Welt“. Das war nach drei gescheiterten Versuchen die erste dauerhaft funktionsfähige Verlegung. Das erste offizielle Telegramm wurde direkt am nächsten Tag empfangen. Gut einen Monat später konnte das vom vorherigen Versuch verlorengegangene Kabel wiedergefunden und aus nahezu 4 km Tiefe an die Oberfläche hochgezogen werden. Auf hoher See wurde es verlängert und ebenfalls bis nach Neufundland gezogen. Damit standen nach nur sechs Wochen schon zwei unabhängig funktionierende Telegrafenverbindungen zur Verfügung.

  ![Gemälde der Kabellandung von 1866: Auf einem hölzernen Steg und am Ufer jubeln Menschen mit erhobenen Hüten, während Seeleute im seichten Wasser das Kabelende von Booten an Land ziehen.](fakten/2026-07-27-1.avif)
