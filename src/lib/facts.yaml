  Heute vor 30 Jahren feierte der erste "Mission: Impossible"-Film seine Weltpremiere in den USA. Basierend auf der Fernsehserie "Kobra, übernehmen Sie" geht es um die sogenannte Impossible Missions Force (IMF), Geheimagenten, die von der Regierung unmögliche Aufträge erhalten, die sie auf der ganzen Welt mithilfe von ausgefeilten technischen Apparaten und Täuschungsmanövern ausführen, nur halt mit Tom Cruise statt Peter Graves in der Hauptrolle. Gesichtsmasken dürfen dabei auch nicht fehlen. Die Fernsehserie wurde schon 23 Jahre vor der Premiere des Films eingestellt; die Filmreihe läuft weiterhin erfolgreich, mit The Final Reckoning als den achten und aktuellsten Teil vom letzten Jahr.

