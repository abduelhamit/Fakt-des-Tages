  Heute vor 29 Jahren erreichte die NASA-Sonde Mars Global Surveyor (MGS) nach einer Flugzeit von zehn Monaten erfolgreich den Mars. Die Angleichung der Umlaufbahn durch mehrere Manöver und das Aerobraking-Verfahren verzögerte sich jedoch aufgrund eines Fehlers in den Solarmodulen um ca. eineinhalb Jahre. Danach machte die Sonde über die gesamte Oberfläche mithilfe der Mars Orbiter Camera (MOC) Fotos in sehr hoher Auflösung und mit dem Mars Orbiter Laser Altimeter (MOLA) eine detaillierte Höhenmessung. Die Ergebnisse deuteten darauf hin, dass es in der Vergangenheit flüssiges Wasser oder schmelzendes Wassereis aus dem Untergrund auf der Oberfläche des Mars gab.

  ![Künstlerische Darstellung der NASA: Die Sonde Mars Global Surveyor schwebt über dem Mars — der mit Goldfolie verkleidete Körper, zwei ausladende Solarausleger und die Hochgewinnantenne an einem langen Mast; darunter die rötliche Marsoberfläche mit hellen Wolkenschleiern.](fakten/2026-09-11-1.avif)
