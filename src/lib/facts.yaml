  Heute vor 225 Jahren wurde Joseph Haydns weltliches Oratorium (eine erzählend-dramatische Komposition mit einer zumeist geistlichen Handlung) Die Jahreszeiten, nicht zu verwechseln mit Die vier Jahreszeiten von Vivaldi, im Wiener Palais Schwarzenberg uraufgeführt. Es war das letzte seiner vier Oratorien. Da es nach einem Libretto von Gottfried van Swieten war, hatte er einen großen Einfluss darauf, zur Missgunst Haydns. Haydn schrieb über die Passage „Und aus dem Sumpfe quakt der Frosch“ in einem Brief: „\[D\]iese ganze Stelle als eine Imitazion eines frosches ist nicht aus meiner feder geflossen; es wurde mir aufgedrungen diesen französischen Quark niederzuschreiben;“

  ![Das Titelblatt der Partitur „Die Jahreszeiten nach Thomson, in Musik gesetzt von Joseph Haydn“, darunter ein Stich mit vier allegorischen Frauengestalten der Jahreszeiten auf Wolken.](fakten/2026-04-24-1.avif)
