  Heute vor 90 Jahren startete in Friedrichshafen der erste Probeflug eines ganz besonderen Luftfahrzeugs: LZ 129, auch bekannt als Hindenburg. Damals noch ein Symbol der technologisierten Zukunft, sind Zeppeline heutzutage kaum anzutreffen, auch wegen dem, was am Ende mit der Hindenburg ein Jahr später passierte.

  ![Schwarz-Weiß-Foto der Hindenburg im Flug, schräg von unten gesehen: der lange, silbrige Rumpf mit dem Schriftzug „Hindenburg“, den olympischen Ringen und der Kennung „D-LZ129“, darunter die Motorgondeln, vor hellem, dunstigem Himmel.](fakten/2026-03-04-1.avif)
  _Foto: [Fortepan / Lőrincze Judit](https://commons.wikimedia.org/wiki/File:Hindenburg_D-LZ129_l%C3%A9ghaj%C3%B3_a_Berlini_Olimpia_idej%C3%A9n._Fortepan_17447.jpg), [CC BY-SA 3.0](https://creativecommons.org/licenses/by-sa/3.0/)_
