  Heute vor 80 Jahren gab's den zweiten Zwischenfall mit dem Demon Core, einer 89 mm großen, 6,2 kg schweren Plutoniumkugel; der erste war neun Monate vergangen. Der Physiker Louis Slotin und seine Kollegen arbeiteten an einem Experiment, bei dem sie zwei Beryllium-Halbkugeln als Neutronenreflektoren um den Plutoniumkern anordneten. Entscheidend war dabei, dass sich die Halbkugeln nicht zu einer vollständigen Kugel legen durften. Der Versuchsaufbau wurde auch tickling the dragon’s tail (dt. „den Drachen am Schwanz kitzeln“) genannt. Normalerweise verhinderte ein Distanzstück eine Berührung der beiden Halbkugeln. Diesmal verwendete Slotin einen Schraubenzieher. Der Schraubenzieher rutschte heraus, der Plutoniumkern wurde vollständig umschlossen und es wurde eine Kettenreaktion ausgelöst, die zur Freisetzung einer hohen Strahlendosis führte. Mit Die Schattenmacher (Originaltitel: Fat Man and Little Boy) gibt's eine fiktionalisierte Verfilmung beider Zwischenfälle.

  ![Schwarz-Weiß-Foto einer nachgestellten Szene: Ein Mann hält mit einer Hand die glänzende obere Beryllium-Halbkugel und mit der anderen einen Schraubenzieher, der sie von der unteren Hälfte getrennt hält; daneben auf der Werkbank weitere Metallhalbkugeln und eine Bürste.](fakten/2026-05-21-1.avif)
