  Heute vor 200 Jahren wurde der Grundstein für das Teatro Carlo Felice gelegt, dem wichtigsten Opernhaus in der italienischen Stadt Genua. Das Haus ist auf nationaler Ebene bekannt und gehört mit seinem Programm, welches Opern, Ballette, Sinfonien, aber auch Vorträge und weitere Veranstaltungen umfasst, zu den besten Italiens.

