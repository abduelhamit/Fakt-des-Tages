  Heute vor 125 Jahren wurde Theodore „Teddy“ Roosevelt Jr. der 26. Präsident der Vereinigten Staaten. Unter William McKinley war Theodore Roosevelt für etwa sechs Monate Vizepräsident, bis Roosevelt im Alter von 42 Jahren nach dem tödlichen Attentat auf McKinley zum Präsidenten vereidigt wurde. Damit ist Roosevelt (bezogen auf sein Lebensalter bei der Amtseinführung) der bislang jüngste Präsident in der Geschichte der USA.

  Als Kandidat der Republikanischen Partei wurde er 1904 wiedergewählt, bevor er 1908 vorerst auf die Kandidatur für eine weitere Amtszeit verzichtete. Auf internationaler Ebene war Roosevelt im Jahr 1906 als erstem Amerikaner der Friedensnobelpreis zuerkannt worden, nachdem er im Vorjahr mit seiner diplomatischen Initiative maßgeblich zum Ende des Russisch-Japanischen Krieges beigetragen hatte. Sein Vorgehen gegen die großen Konzerne, welches zur Auflösung mehrerer Kartelle führte, trug ihm den Ruf des „trust buster“ ein.

  Der Teddybär wurde nach ihm benannt. Nachdem er sich geweigert hatte, einen eher kleinen Bären zu erschießen, den sein Jagdhelfer für ihn an einen Baum gebunden hatte, weil er auf diese Weise nicht zu einer Jagdbeute kommen wollte, stellte der Karikaturist Clifford Berryman von der Washington Post den Bären in einer Karikatur rund und niedlich dar. Einige Leser wollten mehr davon sehen, sodass Berryman ihn auf jeder Abbildung mit dem Präsidenten unterbrachte. Zufällig hatte das deutsche Unternehmen Steiff mit der Produktion von kleinen Bären begonnen, von denen das New Yorker Unternehmen F.A.O. Schwarz 3.000 Stück bestellte. So begann der weltweite Erfolg des Teddybären; schnell verkaufte Steiff das Plüschtier auch im eigenen Land, wo es bis heute unter dem eingedeutschten Namen angeboten wird.

  ![Studioporträt von Theodore Roosevelt: Brustbild im Halbprofil, auf der Nase ein Kneifer mit herabhängender Schnur, darunter ein buschiger Schnauzbart; er trägt einen dunklen Anzug über heller Weste und gemusterter Krawatte, der Hintergrund ist schlicht und grau.](fakten/2026-09-14-1.avif)
