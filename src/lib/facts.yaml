  Heute vor 32 Jahren wurde die erste Folge der US-amerikanischen Sitcom „Friends“ ausgestrahlt. Bereits kurz nach dem Start war die Serie ein großer Erfolg; das Serienfinale knapp zehn Jahre später war in den USA die meistgesehene Fernsehfolge der 2000er. Friends geht über eine reine Sitcom hinaus und weist, vor allem in Bezug auf die Beziehungen der Protagonisten untereinander, Elemente einer Dramaserie auf. Auch werden die Figuren im Laufe der Jahre weiterentwickelt. So wurde sie zu einem Klassiker und zur Vorlage für viele nachfolgende Sitcoms. Es gibt sogar ein Lego-Set zur Serie:

