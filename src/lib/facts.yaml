  Heute vor 72 Jahren gelang es Roger Bannister, ein britischer Mittelstreckenläufer und Neurologe, auf der Leichtathletikanlage der University of Oxford an der Iffley Road als erster Mensch die englische Meile in einer Zeit von unter vier Minuten zu laufen. Dafür und für seine Forschungsleistungen als Neurologe am Pembroke College der Universität Oxford wurde Bannister 1975 von der Königin Elisabeth II. zum Ritter geschlagen und bekam [eine Gedenkplakette an der Iffley Road](https://commons.wikimedia.org/wiki/File:Iffley_Road_Track,_Oxford_-_blue_plaque.JPG "https://commons.wikimedia.org/wiki/File:Iffley_Road_Track,_Oxford_-_blue_plaque.JPG"). Lange Zeit galt die Traummeile als unmöglich, unter Anderem weil die Bahnoberflächen nicht fest und eben genug waren. Erst in den 40er-Jahren kam man der magischen Grenze von vier Minuten nahe.

  ![Schwarz-Weiß-Foto von Roger Bannister mit der Startnummer 329 im Ziel, den Kopf zurückgelegt, den Mund offen und die Arme ausgebreitet, einige Meter hinter ihm ein zweiter Läufer, im Hintergrund Zuschauer und Berge.](fakten/2026-05-06-1.avif)
