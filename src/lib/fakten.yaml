2026-05-18: 'Heute vor 75 Jahren stellte Erik Wallen­berg seine neueste Entwicklung der Öffentlichkeit vor: eine neu­artige tetraeder­förmige Karton­verpackung für Flüssig­keiten, genannt Tetra Pak. Die Tetraeder-Form war damals herstellungsbedingt, da ein bereits befüllter Kartonschlauch jeweils um 90 Grad verdreht abgeklemmt, verschweißt und abgeschnitten wurde. Damals noch für Milch entwickelt, wird die Verpackung für alle möglichen Inhalte in Form eines kompakten Quaders angeboten.'
