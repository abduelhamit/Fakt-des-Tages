2026-06-24: 'Heute vor 125 Jahren wurde in Ambroise Vollards Pariser Galerie die erste Aus­stellung des 18 Jahre alten spa­nischen Malers Pablo Picasso eröffnet. Picasso, neben Georges Braque einer der maßgebenden Gründer des Kubismus, hatte Vollard als Förderer in Picassos Blauer und Rosa Periode; den nachfolgenden kubistischen Werken stand Vollard nicht so positiv gegenüber. Picassos Vater war freischaffender Maler und Lehrer, sodass er schon mit 7 Jahren anfing zu malen und mit 14 Jahren an der Kunstakademie war. Mit 26 fing er mit einem neuen Stil an, für den er weltweit bekannt werden sollte: Kubismus zeichnet sich durch die Zerlegung des Motivs in Grundformen wie z. B. Würfel (daher der Begriff) und durch mehrere Perspektiven gleichzeitig aus. Dadurch fällt die klassische Dreidimensionalität weg; das Bild wirkt flach und fragmentiert.'
2026-06-25: 'Heute vor 13 Jahren hat die CIA öffentlich die Existenz von Area 51 anerkannt. Das passierte nach einer Anfrage 8 Jahre zuvor im Rahmen des Freedom of Information Acts. Von den bisher veröffentlichten Dokumenten weiß man, dass dort viele experimentelle Luftfahrzeuge getestet werden; in GTA: San Andreas konnte man dort sich einen Jetpack schnappen. Am bekanntesten ist wohl aber die Verschwörungstheorie, dass da Aliens festgehalten werden. 2019 wurde im Internet die "Stürmung" des Geländes zum 20. September mit einem Augenzwinkern organisiert. Tausende Menschen kamen zu zwei Musikfestivals in der Nähe, die extra dafür da waren; über 150 Leute sind tatsächlich friedlich bis zu den Eingangstoren von Area 51 gewandert, wo die Kontrolleure natürlich von der Aktion Bescheid wussten und es mit Humor nahmen. Nur 7 Personen wurden verhaftet.'
