2026-04-16: Heute vor 54 Jahren hob die NASA-Mission Apollo 16 in Florida ab. Sie war die vorletzte Mission innerhalb des amerikanischen Apollo-Programms, die fünfte bemannte Landung auf dem Erdmond und die zweite erweiterte Mission mit verlängertem Mondaufenthalt und dem Einsatz des Mondautos Lunar Roving Vehicle. Es war das erste Mal, dass eine Landung in einer zerklüfteten Hochlandregion durchgeführt wurde. Mit dem Rover führten die Astronauten sogar einen "Grand Prix" durch, um die Wendigkeit bei geringer Schwerkraft zu testen. [Das sah nach Spaß aus.](https://commons.wikimedia.org/wiki/File:Ap16_rover.ogv "https://commons.wikimedia.org/wiki/File:Ap16_rover.ogv")
