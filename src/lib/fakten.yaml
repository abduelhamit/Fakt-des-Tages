2026-04-28: 'Heute vor 25 Jahren flog der Unternehmer Dennis Tito zur ISS und gilt damit als der erste Weltraumtourist. Er war aber kein reiner Amateur: Er hatte jahrelang als Raumfahrtingenieur gearbeitet und nahm seit Sommer 2000 erfolgreich am Kosmonautentraining teil. Tito verbrachte insgesamt knapp acht Tage im Weltraum, davon sechs an Bord der ISS. Nach dem Flug erklärte Tito, es sei ein beeindruckendes Erlebnis gewesen, er wäre gern länger im Weltraum geblieben und ein Kindheitstraum hätte sich damit erfüllt. Aber er wolle nicht noch einmal ins All fliegen; dieser eine Flug genüge ihm.'
