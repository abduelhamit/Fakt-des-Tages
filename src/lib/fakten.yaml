2026-07-01: Heute vor 70 Jahren wurde in der Bundesrepublik Deutsch­land und West-Berlin ein neues System der deut­schen Kfz-Kenn­zeichen ein­geführt, das bis heute gültig ist. Bis dahin hatten Kennzeichen weniger Zeichen, die fast alle Ziffern waren. Jedoch war schon einige Jahre zuvor klar, dass das alte System nicht der zunehmenden Motorisierung gewachsen sei, da die vier Ziffern der Nummerierung nicht mehr für alle Kfz eines Verwaltungsbezirks ausreichten. Diese sogenannten DIN-Kennzeichen, benannt nach ihrer Schriftart, die nach DIN 1451 (Mittelschrift) festgelegt ist, unterscheiden sich nur wenig von den heutigen Kenn­zeichen. Die größten Unterschiede sind der Euro-Teil auf der linken Seite, die neue Schrift namens FE-Schrift (FE steht für fälschungserschwerend) und ein paar Änderungen bei den zulässigen. Buchstaben. Sonst sind sie praktisch gleich geblieben.
2026-07-07: 'Heute vor 25 Jahren wurde der erste Schmid Peoplemover, ein Personen­beförderungs­system, dessen Kabine sich zwischen zwei Türmen und einer dazwischen­liegen­den Brücke vertikal und horizontal bewegt, in Pfullingen eingeweiht. Leider wurde sie acht Jahre später stillgelegt. Zwei weitere wurden gebaut. Beide sind bis heute in Betrieb, weitere Schmid Peoplemover wurden aber nicht gebaut. Die Anlage in Altbach soll bis 2029 abgerissen und durch normale Aufzüge ersetzt werden. Die Anlage in Berlin soll ebenfalls zu unbestimmter Zeit rückgebaut werden. Immer wieder bekommt Schmid Anfragen, die er ablehnt, da sein Unternehmen mit anderen Aufträgen ausgelastet sei. Hier ein Video zu Schmid Peoplemovern: [https://www.youtube.com/watch?v=A2g4u9F9i90](https://www.youtube.com/watch?v=A2g4u9F9i90 "https://www.youtube.com/watch?v=a2g4u9f9i90")'
2026-07-15: Heute vor 43 Jahren kamen in Japan zeitgleich die Nintendo Family Computer (Famicom) und die Sega SG-1000 raus, deren internationale Versionen ein paar Jahre später die Nintendo Entertainment System (NES) und die Sega Master System waren. Für Sega war's das Debüt in der Spielkonsolenbranche; Nintendo hatte mit der Color TV-Game schon einige Jahre Erfahrung. Nintendo dominierte mit knapp 62 Mio. verkauften Einheiten; Sega hatte aber mit ca. 20 Mio. Einheiten auch ganz gute Zahlen. Diese Rivalität zwischen den beiden Unternehmen lief fast 18 Jahre, bis sich Sega 2001 vom Konsolenmarkt zurückzog und seitdem nur noch Spiele für PC und andere Konsolen entwickelt; besonders interessant sind dabei die Kollaborationen mit Nintendo wie z. B. Mario und Sonic bei den Olympischen Spielen.
2026-07-16: Heute vor 76 Jahren gewann im De-facto-Endspiel der 4. FIFA-Fußball-Weltmeisterschaft Uruguay gegen den Gastgeber Brasilien 2–1. Vor 200.000 Cariocas im Maracanã-Stadion in Rio de Janeiro ging das Spiel unter dem Namen Maracanaço (Schock von Maracanã) in die Geschichte ein. Brasilien ging zunächst, kurz nach der Halbzeitpause, mit 1:0 in Führung. Mitte der zweiten Hälfte glich Uruguay aus. Zehn Minuten vor Schluss gelang Uruguay der entscheidende Treffer zum Sieg und zur Weltmeisterschaft. Das Spiel galt als Tiefpunkt des brasilianischen Fußballs… bis zur 1:7-Niederlage gegen Deutschland 2014.
2026-07-17: Heute vor 32 Jahren gab's das Finale Brasilien gegen Italien der FIFA-Fußball-Weltmeisterschaft in den USA. Das Spiel war ein torloses 0–0 nach 90 Minuten + 30 Minuten Verlängerung. Brasilien gewann dann beim Elfmeterschießen 3–2 gegen Italien, nachdem Roberto Baggio beim entscheidenden Elfmeter daneben schoss. Das war in der Geschichte der Weltmeisterschaft das erste Finale, was mit Elfmeterschießen entschieden wurde und bis heute das einzige Finale ohne Tore bis zum Elfmeterschießen. Vielleicht kann sich das noch am Wochenende ändern.
