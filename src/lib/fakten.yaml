2026-04-23: 'Heute vor 50 Jahren wurden am selben Tag drei Bands gleich drei einflussreiche Musikalben veröffentlicht: Ramones veröffentlichte ihr gleichnamiges Punk-Rock-Debüt-Album, dessen bekanntester Song wahrscheinlich [Blitzkrieg Bop](https://www.youtube.com/watch?v=268C3N2dDYk "https://www.youtube.com/watch?v=268C3N2dDYk") ist, Black and Blue von den Rolling Stones, wo sie Rock ’n’ Roll mit Reggae und Funk kombiniert haben und Too Old to Rock ''n'' Roll: Too Young to Die! von Jethro Tull, welches [den gleichnamigen Song](https://www.youtube.com/watch?v=VcmJThaACHQ "https://www.youtube.com/watch?v=VcmJThaACHQ") beinhaltet und das erste Album vom Bassisten John Glascock ist.'
2026-04-24: "Heute vor 225 Jahren wurde Joseph Haydns weltliches Oratorium (eine erzählend-dramatische Komposition mit einer zumeist geistlichen Handlung) Die Jahreszeiten, nicht zu verwechseln mit Die vier Jahreszeiten von Vivaldi, im Wiener Palais Schwarzen­berg urauf­geführt. Es war das letzte seiner vier Oratorien. Da es nach einem Libretto von Gottfried van Swieten war, hatte er einen großen Einfluss darauf, zur Missgunst Haydns. Haydn schrieb über die Passage „Und aus dem Sumpfe quakt der Frosch“ in einem Brief: „\\[D\\]iese ganze Stelle als eine Imitazion eines frosches ist nicht aus meiner feder geflossen; es wurde mir aufgedrungen diesen französischen Quark niederzuschreiben;“"
