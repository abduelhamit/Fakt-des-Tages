  Heute vor 435 Jahren wurde die Rialtobrücke in Venedig eröffnet, eines der bekanntesten Bauwerke der Stadt. Die Steinbrücke führt über den Canal Grande und hat eine Länge von 48 m, eine Breite von 22 m und eine Durchfahrtshöhe von 7,50 m. Zuvor wurde sie über 400 Jahre lang mehrfach aus Holz wiederaufgebaut, nachdem sie verbrannte oder einstürzte. Die Idee, die Brücke in Stein wiederaufzubauen, wurde erstmals 1503 vorgeschlagen. Danach hat es nur 85 Jahre gedauert, bis man endlich mit dem Bau begann.

