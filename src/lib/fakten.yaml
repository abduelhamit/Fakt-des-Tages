  Heute vor 70 Jahren erschien die erste Ausgabe der Bravo, ein Jugendmagazin der Bauer Media Group, das über Jahrzehnte hinweg die Jugendkultur zahlreicher Jahrgänge von Jugendlichen geprägt hat. Die Startauflage betrug 30.000 Exemplare und der Verkaufspreis 50 Pfennig (heute inflationsbereinigt etwa 1,52 €). Auf der Titelseite war Marilyn Monroe abgebildet.

  ![Die erste Bravo-Titelseite vom 26. August 1956: über dem Bild der Schriftzug „BRAVO — Die Zeitschrift für Film und Fernsehen, Nummer 1, 50 Pfennig“, darunter eine lachende Marilyn Monroe im schwarzen Spitzenkleid neben der Zeile „Haben auch Marilyns Kurven geheiratet?“, ringsum weitere Filmszenen.](fakten/2026-08-26-1.jpg)

  Die Verbreitung des Internets und Social Media führten zu extremen Auflagenverlusten. Die verkaufte Auflage beträgt heutzutage unter 50.000 Exemplare, ein Minus von über 95% seit 1998.
