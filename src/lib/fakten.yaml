2026-07-21: "Heute vor 19 Jahren wurde das siebte und letzte Band der Harry-Potter-Reihe, Harry Potter und die Heiligtümer des Todes, veröffentlicht. Ich überspringe den Inhalt und gehe direkt zu den Zahlen: Bereits vor dem Erscheinungstermin wurde das Buch weltweit 1,6 Millionen Mal vorbestellt; in Deutschland waren es 450.000 Vorbestellungen. Die Verkaufszahlen schlugen den Rekord des Vorgängers: In den ersten 24 Stunden wurden 8,3 Millionen Exemplare verkauft, nach 10 Tagen waren es sogar 11,5 Millionen, in den ersten fünf Jahren wurden weltweit 44 Millionen Exemplare verkauft. Bis heute sind's schätzungsweise 50 Millionen Exemplare, womit es zu den meistverkauften Büchern der Welt zählt."
2026-07-22: Heute vor 75 Jahren waren die russischen Hündinnen Desik (Дезик) und Zygan (Цыган) die ersten Wirbeltiere, die einen Raumflug überlebten. Vier Jahre zuvor brachten die Vereinigten Staaten mit einigen Fruchtfliegen erstmals Tiere ins Weltall, die den Flug auch überlebten. Danach begannen die USA, mit Rhesusaffen und Mäusen erstmals Wirbeltiere ins Weltall zu schicken, die jedoch ihre Flüge allesamt nicht überlebten. Russland entschied sich für Hunde, da Sergei Koroljow, der damals führende sowjetische Raketeningenieur glaubte, dass die emotionale Bindung der Wissenschaftler zu den Hunden deren Gehorsam gewährleisten würde. Außerdem waren sie Straßenhunde aus Moskau, die bereits an das Überleben unter schwierigen Bedingungen kannten, mussten weiblich sein, damit sie in ihren Raumanzügen problemlos urinieren konnten und helles Fell haben, um sie auf den Aufnahmen der Bordkamera gut zu erkennen.
2026-07-23: 'Heute vor 16 Jahren wurde die britische Boyband One Direction gegründet. Die fünf Mitglieder meldeten sich bei der Castingshow The X Factor an (nicht zu verwechseln mit X-Factor: Das Unfassbare, präsentiert von Jonathan Frakes), konnten sich solo im Bootcamp nicht durchsetzen, wurden aber von der Jury zu einer Band geformt, die zwar die Show nicht gewann, aber dennoch erfolgreich genug für einen Plattenvertrag war. Ein Jahr später veröffentliche sie die Single „What Makes You Beautiful“, welche ein internationaler Hit wurde und die Bandmitglieder zu Stars machte. Bei der Schlussfeier der Olympischen Sommerspiele 2012 in London durften sie mit dem Song neben anderen Acts auftreten. Nach insgesamt sechs Jahren und fünf allesamt erfolgreichen Alben hat die Band bis auf Weiteres eine Pause eingelegt.'
2026-07-24: Heute vor 115 Jahren entdeckte eine Expedition unter Leitung von Hiram Bingham in den peruanischen Anden die Ruinen der von den Inka im 15. Jahr­hundert er­bauten Stadt Machu Picchu. Die Inka erbauten die Stadt in 2430 Metern Höhe auf einem Bergrücken zwischen zwei Gipfeln. Die UNESCO nahm Machu Picchu 1983 in die Liste des Weltkulturerbes auf und ist eine der größten Touristenattraktionen in Südamerika. 2017 besuchten über 1,4 Mio. Personen die Sehenswürdigkeit; dies entspricht einem täglichen Durchschnitt von knapp 3.900 Personen. Die UNESCO fordert jedoch eine Reduktion auf höchstens 800 Besucher täglich, um das Kulturerbe nicht zu gefährden.
2026-07-27: 'Heute vor 160 Jahren erreichte die Great Eastern ihr Ziel auf Neufundland, nachdem sie vor genau zwei Wochen von Irland aus startete. An Bord: das andere Ende des trans­atlantischen Telegrafen­kabels, die Verbindung zwischen der „alten“ und der „neuen Welt“. Das war nach drei gescheiterten Versuchen die erste dauerhaft funktionsfähige Verlegung. Das erste offizielle Telegramm wurde direkt am nächsten Tag empfangen. Gut einen Monat später konnte das vom vorherigen Versuch verlorengegangene Kabel wiedergefunden und aus nahezu 4 km Tiefe an die Oberfläche hochgezogen werden. Auf hoher See wurde es verlängert und ebenfalls bis nach Neufundland gezogen. Damit standen nach nur sechs Wochen schon zwei unabhängig funktionierende Telegrafenverbindungen zur Verfügung.'
2026-07-29: 'Heute vor 208 Jahren reichte der französische Physiker Augustin-Jean Fresnel bei der Académie des sciences (Akademie der Wissenschaften) eine Abhandlung über die Beugung des Lichts ein. Damit lieferte er starke Unterstützung für die Wellentheorie des Lichts. Das Problem: Man nahm an, dass Lichtwellen, ähnlich wie Schallwellen, ein Medium zur Ausbreitung benötigten. Dieser hypothetischer Lichtäther wurde Ende des 19. Jahrhunderts durch das Michelson-Morley-Experiment stark in Zweifel gezogen. Heute haben wir dank der speziellen Relativitätstheorie ein Konzept, was kein Äther benötigt. Jedoch wurde die Debatte um Wellentheorie des Lichts mit dem Welle-Teilchen-Dualismus aus der Quantenphysik verkompliziert.'
2026-08-11: Heute vor 34 Jahren wurde in Bloomington (Minnesota) die Mall of America eröffnet. An ihrer Stelle stand früher das Metropolitan Stadium. Mit einer Brutto-Grundfläche von über 520.000 m² ist sie die größte Shopping-Mall der USA und war die zweitgrößte weltweit; Platz 1 belegte damals die CentralWorld in Bangkok. Die Mall of America bietet den jährlich über 40 Mio. Besuchenden über 500 Shops an. Außerdem gibt's einen Indoor-Freizeitpark (Nickelodeon Universe), ein Aquarium (Underwater World), ein Kino mit 14 Sälen, ein Lego Imagination Center, ein Dinosaurier-Museum, Diskotheken und einen NASCAR-Simulator. Durch diese Einrichtungen wird die Mall of America auch als Urban Entertainment Center angesehen.
2026-08-12: 'Heute vor 175 Jahren patentierte Isaac Singer die "Singer’s Nummer 1", die als "erste praktische Nähmaschine der Welt" vermarktet wurde. Das Problem: Nur fünf Jahre zuvor patentierte Elias Howe auch eine Nähmaschine. Wegen dem Patent und den Maschinen, die schon verkauft wurden, gab es einen jahrelangen Rechtsstreit zwischen den Beiden, den am Ende 1854 Howe für sich gewann. Um weitere solche Schwierigkeiten in der frisch aufblühenden Nähmaschinenindustrie zu vermeiden, gründeten Howe, I. M. Singer & Co., Wheeler & Wilson und Grover & Baker 1856 die Sewing Machine Combination, wo sie neun ihrer Patente in einen Topf warfen und damit die erste Patentgemeinschaft der USA gründeten.'
2026-08-13: Heute vor 25 Jahren wurde die Veltins-Arena (ursprünglich Arena AufSchalke) in Gelsenkirchen eröffnet. Dank des schließbaren Dachs und verschiebbaren Spielfeldrasens dient es nicht nur als Fußballstadion, sondern auch für Konzerte, Opernaufführungen und andere Wettbewerbe. Zur Einweihung wurden der 1. FC Nürnberg und Borussia Dortmund eingeladen, die zusammen mit den Gastgebern, dem FC Schalke 04, ein Blitzturnier austrugen. Mit 2,37 Mio. Besuchern war die Arena 2014 das meistbesuchte Stadion Deutschlands. In den Jahren 2015, 2016 und 2017 belegte sie mit 2,58 Mio., 2,34 Mio. und 2,30 Mio. Besuchern den zweiten Platz hinter der Allianz Arena.
