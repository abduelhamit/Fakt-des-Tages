  Heute vor 115 Jahren stiehlt der Italiener Vincenzo Peruggia die Mona Lisa. Durch dieses Ereignis wurde das Gemälde erst zu dieser großen Berühmtheit.

  Peruggia, der zu dieser Zeit wegen Renovierungs­arbeiten als Glaser im Louvre tätig war, hatte sich in einem Schrank versteckt, sich über Nacht im Museum einschließen lassen, das Bild aus dem Rahmen gelöst und am Folgetag, vermutlich eingewickelt in seinen Kittel, aus dem Museum geschmuggelt. Zunächst gerieten Guillaume Apollinaire und Pablo Picasso (ja, der Picasso) in den Verdacht, die Mona Lisa gestohlen zu haben. Das Gericht konnte aber ihnen keine Mittäterschaft an dem Diebstahl der Mona Lisa nachweisen und die Künstler wurden freigesprochen. Weitere Ermittlungen der Polizei gingen ins Leere; der Diebstahl blieb mehr als zwei Jahre lang ungeklärt. Viele Bürger gingen in den Louvre, um sich die leere Stelle an der Wand anzusehen, während fliegende Händler vor dem Louvre Postkarten und Reproduktionen der Mona Lisa verkauften. War das Bild schon vor dem Diebstahl bekannt gewesen, so wurde es nun nach seinem Verschwinden wirklich berühmt.

  Bisher hatte Peruggia die Mona Lisa in seiner Wohnung, letztlich aber wollte er sie „heim“ nach Italien bringen. Daher versuchte er, das Bild in Florenz an den Kunsthändler Alfredo Geri zu verkaufen. Geri informierte Giovanni Poggi, den Direktor der Uffizien, und bekundete sein Interesse. Peruggia kam nach Florenz und zeigte das Bild in seinem Hotelzimmer. Nachdem sich Geri und Poggi sicher waren, dass sie das Original vor sich hatten, überredeten sie Peruggia, in seinem Hotel auf das Geld zu warten und riefen die Polizei. Die Reaktion der Öffentlichkeit war heftig. Italienische Nationalisten verlangten, dass „ihre“ Mona Lisa „zu Hause“ bleiben solle. Die italienische Regierung versicherte zwar, dass sie die Mona Lisa an den Louvre zurückerstatten werde, aber zuerst ging das Gemälde „auf Tournee“ und wurde in Florenz, Rom und Mailand ausgestellt. Es reiste in einer eigens angefertigten, gepolsterten Kiste und mit Ehrenwache. Schließlich kehrte die Mona Lisa mit einer großen Staatszeremonie wieder nach Paris zurück.
2026-08-24: 'Heute vor 20 Jahren verlor Pluto seinen Status als Planeten. Die Debatte fing aber schon 1801 an, als Ceres entdeckt wurde, der sich Pluto ähnelt. In den 2000ern wurden mindestens drei weitere solcher Himmelskörper entdeckt (Quaoar, Sedna und Eris), sodass man sich die Frage stellen musste, ob man die alle als Planeten bezeichnen möchte. Die Internationale Astronomische Union (IAU), eine weltweite Vereinigung von Astronomen mit Sitz in Paris, begann schon acht Tage bevor Pluto seinen Status verlor mit dem ersten Vorschlagsentwurf, wie Planeten definiert werden sollten. Nach zwei weiteren Vorschlagsrunden wurde der dritte, finale Entwurf zur Wahl gestellt und dafür gestimmt. Laut dieser neuen Definition ist ein Planet ein Himmelskörper, der (a) die Sonne umkreist, (b) über genügend Masse verfügt, damit seine Eigenanziehungskraft die Kräfte starrer Körper überwindet und er eine Form im hydrostatischen Gleichgewicht (nahezu Kugelgestalt) annimmt, und (c) die Umgebung seiner Umlaufbahn bereinigt hat. Punkt C ist der Knackpunkt bei Pluto: Er befindet sich im Kuipergürtel und teilt sich seine Bahn mit anderen Objekten wie Eris. Daher wurde Pluto, wie die vorher erwähnten Körper auch, als Zwergplanet eingestuft und ist nicht mehr neben den acht Planeten eingereiht.'
