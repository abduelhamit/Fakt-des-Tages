  Heute vor 1.408 Jahren ernannte sich Tang Gaozu, zu jenem Zeitpunkt noch der chinesische General Li Yuan, zum Kaiser und läutete damit die Tang-Dynastie ein. Diese war fast 300 Jahre an der Macht und gilt in der historischen Forschung als ein Höhepunkt der Geschichte Chinas. Die ersten ~40 Jahre war die Dynastie mit dem Staatsaufbau beschäftigt, größtenteils unter Gaozus Sohn Tang Taizong, geboren als Li Shimin. Den Höhepunkt hatte sie ab 713 unter Tang Xuanzong, geboren als Li Longji. Unter Xuanzong erlebte Tang-China zunächst ein Goldenes Zeitalter des Friedens, der Kultur und Gelehrsamkeit… und anschließend einen jähen Absturz. Ursachen waren u. A. die erhöhten Militärausgaben ständiger Kriege entlang der Seidenstraße, die sich in Form von erhöhten Steuern bemerkbar machten und die wackelige Balance der staatlichen Institutionen, die gegen 750 kippte, als die Truppen an der Nordgrenze die kaiserlichen Truppen in der Hauptstadt zahlenmäßig übertrafen. Der endgültige Untergang der Tang kam aber erst mit dem Aufstand des Huang Chao 876–884, bis die Dynastie von einem General namens Zhu Wen (einem Überläufer Huang Chaos) 907 endgültig beendet wurde.

