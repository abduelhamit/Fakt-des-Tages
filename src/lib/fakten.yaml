2026-05-21: "Heute vor 80 Jahren gab's den zweiten Zwischenfall mit dem Demon Core, einer 89 mm großen, 6,2 kg schweren Plutoniumkugel; der erste war neun Monate vergangen. Der Physiker Louis Slotin und seine Kollegen arbeiteten an einem Experiment, bei dem sie zwei Beryllium-Halbkugeln als Neutronenreflektoren um den Plutoniumkern anordneten. Entscheidend war dabei, dass sich die Halbkugeln nicht zu einer vollständigen Kugel legen durften. Der Versuchsaufbau wurde auch tickling the dragon’s tail (dt. „den Drachen am Schwanz kitzeln“) genannt. Normalerweise verhinderte ein Distanzstück eine Berührung der beiden Halbkugeln. Diesmal verwendete Slotin einen Schraubenzieher. Der Schraubenzieher rutschte heraus, der Plutoniumkern wurde vollständig umschlossen und es wurde eine Kettenreaktion ausgelöst, die zur Freisetzung einer hohen Strahlendosis führte. Mit Die Schattenmacher (Originaltitel: Fat Man and Little Boy) gibt's eine fiktionalisierte Verfilmung beider Zwischenfälle."
2026-05-22: 'Heute vor 30 Jahren feierte der erste "Mission: Impossible"-Film seine Weltpremiere in den USA. Basierend auf der Fernseh­serie "Kobra, übernehmen Sie" geht es um die sogenannte Impossible Missions Force (IMF), Geheimagenten, die von der Regierung unmögliche Aufträge erhalten, die sie auf der ganzen Welt mithilfe von ausgefeilten technischen Apparaten und Täuschungsmanövern ausführen, nur halt mit Tom Cruise statt Peter Graves in der Hauptrolle. Gesichtsmasken dürfen dabei auch nicht fehlen. Die Fernsehserie wurde schon 23 Jahre vor der Premiere des Films eingestellt; die Filmreihe läuft weiterhin erfolgreich, mit The Final Reckoning als den achten und aktuellsten Teil vom letzten Jahr.'
