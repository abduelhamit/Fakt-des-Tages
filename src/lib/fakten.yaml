  Heute vor 125 Jahren gab's am selben Tag gleich zwei Ereignisse, zwischen denen ich mich nicht entscheiden konnte:

  Der Große Saal des Moskauer Konservatoriums, einer der akustisch besten Konzert­säle, wurde mit einer Aufführung der Oper Ruslan und Ljudmila von Michail Glinka eröffnet. Das Konservatorium selbst wurde schon 35 Jahre zuvor gegründet und ist das zweitälteste in Russland nach dem Sankt Petersburger Konservatorium.

  Gleichzeitig wurde in München das Schauspiel­haus eröffnet. Die Anfänge der Planung wurden zwei Jahre zuvor an das Familienunternehmen Heilmann & Littmann vergeben. Nach zehnmonatiger Bauzeit wurde das Theater am 20. April 1901 mit Johannes, einer Tragödie von Hermann Sudermann, eröffnet; 25 Jahre später zog die Münchner Kammerspiele dort ein und haben ihren Sitz bis heute.
