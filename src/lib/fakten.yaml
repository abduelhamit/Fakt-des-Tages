2026-04-10: Heute vor 165 Jahren gründete William Barton Rogers, ein damals bekannter Naturforscher, das Massachusetts Institute of Technology, kurz MIT. Er wollte eine unabhängige Universität schaffen, mit Ausrichtung auf die Erfordernisse eines zunehmend industrialisierten Amerika. Wegen des Bürgerkrieges konnten die ersten Studierenden erst vier Jahre später aufgenommen werden. In den späten 1990er-Jahren war Risikokapital im Überfluss vorhanden, sodass sich rund um das MIT ein Netz aus Hightech-Startups angesiedelt hat. Die Hochschule ist zudem Gründungsorganisation und Sitz des World Wide Web Consortium (W3C), des Standardisierungsgremiums für das World Wide Web.
