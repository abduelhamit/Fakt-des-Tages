2026-04-14: 'Heute vor 56 Jahren war die Geburtsstunde des Satzes: "Houston, we have a problem", nachdem ein explodierter Sauerstofftank der Apollo 13 die Elektronik beschädigt hatte. [Der genaue Wortlaut war etwas anders](https://en.wikipedia.org/wiki/File:Apollo13-wehaveaproblem.ogg "https://en.wikipedia.org/wiki/File:Apollo13-wehaveaproblem.ogg"); das Zitat, wie wir''s heute kennen, stammt aus dem Film "Apollo 13" aus dem Jahr 1995. Heutzutage bereitet [Outlook Probleme auf dem Weg zum Mond](https://www.heise.de/news/Artemis-2-Outlook-verursacht-nicht-nur-auf-der-Erde-Probleme-11245530.html "https://www.heise.de/news/Artemis-2-Outlook-verursacht-nicht-nur-auf-der-Erde-Probleme-11245530.html"). Wie das in Zukunft genau dramatisiert wird, wird sich noch zeigen; die Serie "Space Force" gab uns [schon vor drei Jahren einen Vorgeschmack](https://www.youtube.com/watch?v=xDLvUqhwHZc "https://www.youtube.com/watch?v=xDLvUqhwHZc") darauf.'
