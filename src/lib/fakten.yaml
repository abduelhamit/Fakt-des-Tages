2026-05-12: Heute vor 100 Jahren überflogen der Luft­fahrt­pionier Umberto Nobile und die Polar­forscher Roald Amundsen und Lincoln Ellsworth mit dem Luft­schiff Norge den Nordpol. Es ist das erste gesicherte Erreichen des Nordpols. Der Flug startete am 10. April in Rom; nach diversen Zwischenstopps u. A. in Pulham, Oslo und Gatchina erreichten sie Ny-Ålesund, Spitzbergen, von wo dann der Flug zum Nordpol ca. 16 Stunden dauerte, bevor sie einige Zeit später in Teller, Alaska landeten.
