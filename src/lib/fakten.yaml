2026-05-08: Heute vor 11 Stunden machte ich mich von meiner Schwester auf dem Weg nach Hause. Leider fuhr zur der Zeit nur noch der Schienenersatzverkehr (SEV). Ich habe an der Stelle, wo die App meinte, dass der Bus kommen sollte gewartet. Nachdem auch nach einer halben Stunde keiner kam, machte ich mich einen Kilometer zu Fuß über die Duisburg-Düsseldorfer Grenze, um mit flexy, einem On-Demand-Service der Bahn, nach Hause zu kommen, nur um festzustellen, dass der eine halbe Stunde braucht, bis er überhaupt bei mir ankommt. Dann habe ich stattdessen die Zeit genutzt, um zur nächsten S-Bahn-Haltestelle zu laufen in der Hoffnung, den SEV dort zu erwischen. Den habe ich mit Glück erwischt, da sich herausstellte, dass die SEV-Punkte in der App komplett unzuverlässig ist und der Bus eher zufällig auf dem Weg mich gekreuzt hat. Der übersprang dann aber auch einige Stellen auf dem Weg, sodass ich nicht an meiner Stelle, sondern erst beim Hauptbahnhof ausgestiegen bin. Zum Glück hatte ich noch die letzte Straßenbahn in der Nacht, die zu mir fuhr erwischt, aber letztlich wurde aus einer Fahrt, die eher eine halbe bis Dreiviertelstunde braucht einfach über zwei Stunden. Daher bin ich etwas spät dran und überspringe die Suche nach einem Fakt des Tages.
