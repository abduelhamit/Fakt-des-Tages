2026-06-16: 'Heute vor 66 Jahren wurde Alfred Hitchcocks Psycho veröffentlicht, zuerst nur in New York City, weil an den Erfolg des Films gezweifelt wurde. Doch nachdem die Leute für den Film Schlange standen, strahlten immer mehr Kinos ihn aus, bis ca. drei Monate später der gesamte US ihn zeigte. Heute gilt er als Hitchcocks bestes, berühmtestes und einflussreichstes Werk. Nach Hitchcocks Tod produzierte Universal viele Nachfolger: drei Sequels, ein Remake, ein Spin-Off fürs Fernsehen und eine Fernsehserie; keine Ahnung, ob irgendwas davon was taugt. Das Original war damals sehr kontrovers und wurde international an verschiedenen Stellen zensiert und geschnitten. Erst 2020 veröffentlichte Universal zum 60. Jubiläum die komplett ungeschnittene Fassung auf Blu-ray.'
2026-06-17: Heute vor 125 Jahren begann in Berlin die „II. Ortho­graphische Konferenz“, die drei Tage lief. Auf der fand unter Betei­ligung von Konrad Duden (derselbe Duden wie beim gleichnamigen Wörterbuch) „Bera­tungen über die Einheit­lichkeit der deut­schen Recht­schreibung“ statt und ein amt­liches Regel­werk für den Behörden­gebrauch wurde beschlossen. Diese Beschlüsse wurden im Laufe des nächsten Jahres durch die Regierungen umgesetzt. Kaiser Wilhelm II. war anfangs gegen einen Gebrauch der neuen Rechtschreibung. Er ließ sich jedoch überzeugen und stimmte später der Verwendung zu, bestand aber bis 1911 darauf, dass ihm vorgelegte Schriftstücke in der alten Rechtschreibung geschrieben sein mussten. Die nächste Reform gab's erst 1996; 1944 gab es einen gescheiterten Versuch.
