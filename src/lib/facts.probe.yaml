2026-08-23: |
  Testdaten — bewusst lang, damit die Seite über eine Bildschirmhöhe hinauswächst und sich das
  Kleben der Datumsleiste überhaupt beobachten lässt.

  Der zweite Absatz trägt zur Höhe bei. Wird dieser Eintrag gekürzt, prüft der Scroll-Test nichts
  mehr, obwohl er weiterhin grün ist.

  ## Zwischenüberschrift

  Ein Absatz darunter, damit auch eine Überschrift im Text vorkommt.

  - erster Punkt
  - zweiter Punkt
  - dritter Punkt

  > Ein Zitat, das ebenfalls Höhe beisteuert.

  Noch ein Absatz. Und weil das immer noch nicht reicht, um bei 720 Pixeln Fensterhöhe sicher über
  den Rand zu kommen, folgt hier ein weiterer.

  Ab hier geht es nur noch um Höhe. Der Scroll-Test verlangt, dass die Seite bei 1280 × 720 Pixeln
  weit genug scrollt, damit die Datumsleiste oben ankommt und dort kleben bleibt.

  Reicht die Höhe nicht, sitzt die Leiste am Seitenende immer noch unterhalb des oberen Rands, und
  der Test misst einen zu großen Wert, statt still durchzugehen.

  Deshalb stehen hier mehr Absätze, als für die Darstellung nötig wären. Sie sind Testmaterial, kein
  Beispieltext für echte Einträge.

  Ein weiterer Absatz derselben Sorte, damit auch bei größeren Fenstern noch Reserve bleibt.

  Und noch einer, denn die Reserve kostet nichts: die Datei wird nie ausgeliefert.

  Ein letzter Absatz, damit der untere Rand des Textblocks tief genug liegt.

2026-08-26: |
  Testdaten — Fakt mit Zwischenüberschrift, ebenfalls bewusst lang.

  ## Hintergrund

  Der zweite lange Eintrag. Er wird gebraucht, damit ein Sprung von einem langen Fakt zu einem
  langen Fakt geprüft werden kann: Ist das Ziel kürzer als die Seitenhöhe, kappt der Browser die
  Scrollposition auf 0, und der Test misst das Kappen statt den Sprung.

  Ein weiterer Absatz für die nötige Höhe.

  - eine Aufzählung, die sich von der des 23. unterscheidet
  - damit beim Überfliegen der Datei klar ist, dass hier zwei Einträge stehen
  - und nicht versehentlich zweimal derselbe

  > Ein zweites Zitat, mit anderem Wortlaut als das weiter oben.

  Und noch ein Absatz, damit auch nach dem Sprung genug Seite unter der Leiste übrig bleibt.

  ## Noch eine Zwischenüberschrift

  Ab hier geht es wieder nur um Höhe. Der Sprungtest verlangt, dass diese Seite mindestens bis zum
  Klebepunkt der Leiste scrollbar bleibt — sonst kappt der Browser die Zielposition, und gemessen
  wird das Kappen statt der Sprung.

  Deshalb steht hier reichlich Reserve, statt die Länge auf den Pixel genau auszureizen: eine andere
  Schriftgröße oder Fensterhöhe soll den Test nicht wieder auf die Kante schieben.

  Ein weiterer Absatz dieser Sorte.

  Und noch einer, denn die Datei wird ohnehin nie ausgeliefert.

  Ein letzter Absatz zum Abschluss.

