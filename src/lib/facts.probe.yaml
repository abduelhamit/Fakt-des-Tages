# Testdaten für die Playwright-Tests — NICHT der Inhalt der Website.
#
# Sie ersetzt src/lib/facts.yaml nur beim Bauen für die Tests — wie, steht bei `FACTS_PROBE` in
# vite.config.ts. `pnpm build` rührt sie nicht an, sie kann also nie online gehen.
#
# Die Tests in src/routes/page.e2e.ts hängen an dieser Form: drei Monate, Lücken innerhalb des
# Augusts und zwei bewusst lange Einträge am 23. und 26. Wer hier etwas ändert, ändert die Tests.
# Der 31. trägt ein Bild, dessen Alt-Text das Wort „Wasserspeier“ enthält — sonst steht es nirgends.
# Damit prüft die Suche, dass Alt-Texte im Index landen. Die Bilddatei ist eine echte aus dem
# Archiv, damit sie im Test-Build wirklich ausgeliefert wird. Darunter hängt ein Bildnachweis und
# darunter noch ein Absatz: daran misst der Test, dass der Nachweis näher am eigenen Bild klebt
# als am nächsten Element. Ohne den Absatz gäbe es keinen zweiten Abstand zu vergleichen. Ganz
# unten hängt dasselbe Bild noch einmal ohne Nachweis: daran prüft der Test, dass die Regel nur
# auf Bilder mit Nachweis zielt. Sein Alt-Text enthält „Wasserspeier“ bewusst nicht.
# Achtung beim Umformulieren: dieser Text landet im Suchindex. „hinter“ stand hier einmal
# und war ein zweiter Treffer für die Anfrage `Hinterg` — der Präfix-Test fiel um.
# Der 30. Juli ist absichtlich der letzte Eintrag der Datei, außer der Reihe: neue Einträge werden
# angehängt, auch wenn ihr Datum früher liegt, und so prüfen die Tests, dass die Seite die Daten
# selbst sortiert.
# Die echten Fakten stehen nebenan in facts.yaml und dürfen frei bearbeitet werden.

